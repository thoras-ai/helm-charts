---
# Image tag for the console components.
consoleVersion: "latest"

imageCredentials:
  registry: "us-east4-docker.pkg.dev/thoras-registry/platform"
  username: "_json_key_base64"

  # License key. Mutually exclusive with secretRef.
  password: ""
  # Name of a dockerconfigjson Secret already in the console namespace.
  secretRef: ""
  imagePullSecretInDeployment: false

imagePullPolicy: "IfNotPresent"

logLevel: info

# -- Additional environment variables that will be passed onto all console components
env: []

# -- Proxy settings passed to all console components
proxy:
  httpProxy: ""
  httpsProxy: ""
  noProxy: ""

# -- Labels added to every resource this chart renders
labels: {}

# -- Annotations added to every console pod
podAnnotations: {}

nodeSelector: {}

tolerations: []

# -- Cluster-wide affinity, applied to components that opt in via
# useGlobalAffinity
affinity: {}

# -- Cluster-wide priorityClassName, overridden per component
priorityClassName: ""

# -- Cluster-wide topology spread, overridden per component
topologySpreadConstraints: []

networkPolicy:
  enabled: false
  # kubernetes (NetworkPolicy) or cilium (CiliumNetworkPolicy).
  flavor: kubernetes
  # -- Ports the API server listens on after DNAT, not its Service port (8443 on
  # minikube). Ignored by the cilium flavor. Check with:
  #   kubectl get endpointslice -n default -l kubernetes.io/service-name=kubernetes
  apiServerPorts:
  - 443
  - 6443

serviceMonitor:
  enabled: false
  # Empty defers to the Prometheus default.
  interval: ""
  additionalLabels: {}

# -- How people sign in, for both console-api and the dashboard.
auth:
  # local (one shared admin password), oidc (your identity provider), or both.
  mode: local

  local:
    # A label on the admin user; nothing signs in with it.
    adminEmail: admin@localhost
    # Minimum 12 characters. Generated when empty.
    adminPassword: ""
    # Read the password from your own Secret. Mutually exclusive with
    # adminPassword.
    existingSecret:
      secretName: ""
      passwordKey: local-admin-password
    # Not secret, but unique to this install and never changed once set:
    # changing it signs everyone out. Minimum 16 characters.
    adminSalt: ""

  # -- Required for mode oidc or both.
  oidc:
    # Must match the token's iss claim exactly, trailing slash included.
    issuer: ""
    # Accepted values of the token's aud claim.
    audiences: []
    # Only when the issuer URL is unreachable from inside the cluster.
    jwksUri: ""

    # -- The dashboard's OAuth client. Register https://<dashboard-host>/landing
    # as its callback URL.
    client:
      id: ""
      # Every scope must be defined on your provider.
      scope: "openid profile read:* write:clusters write:cluster-tokens"
      # Auth0 only. Defaults to the first of audiences.
      audience: ""

consoleApi:
  enabled: true
  replicas: 1

  # Repository is joined to imageCredentials.registry; the tag is consoleVersion.
  image:
    repository: console-api

  containerPort: 8080
  port: 80

  # -- Served on its own port, off the ingress-published containerPort.
  prometheus:
    enabled: true
    port: 9104

  # -- The ingest address tenant clusters sync to. Give it its own host: the
  # dashboard refuses ingest.
  ingress:
    enabled: false
    ingressClassName: "nginx"
    annotations: {}
    hosts:
      - host: console-api.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # -- The same route as an HTTPRoute.
  gatewayAPI:
    enabled: false
    annotations: {}
    parentRefs:
      - name: gateway
        namespace: default
    hostnames:
      - console-api.local
    path: /
    pathType: PathPrefix

  serviceAccount:
    name: thoras-console-api

  service:
    annotations: {}

  labels: {}
  podAnnotations: {}

  # minAvailable takes precedence over maxUnavailable if both are set.
  pdb:
    enabled: false
    maxUnavailable: 1
    # minAvailable:

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    # No CPU limit: throttling a request handler is worse than letting it burst.
    limits:
      memory: 1Gi

  # -- Run migrations at startup, under an advisory lock so replicas can start
  # together. Disable only if you apply migrations yourself.
  migrateOnStart: true

  # -- Auto-provision and implicitly use one organization.
  singleOrg:
    enabled: true
    # Renames the existing organization if changed after install.
    name: "Default Organization"

  # -- Let tenant clusters register themselves with one shared secret, set as
  # cloudSync.joinSecret in their thoras chart. Requires singleOrg.
  clusterJoin:
    enabled: false
    # Minimum 32 characters. Generated when empty.
    secret: ""
    # Mutually exclusive with secret.
    existingSecret:
      secretName: ""
      secretKey: cluster-join-secret

  webhook:
    # -- Shared secret for the identity-provider user-created webhook. Required
    # only when that webhook is in use.
    secret: ""

    # -- Read it from your own Secret. Mutually exclusive with secret.
    existingSecret:
      secretName: ""
      secretKey: webhook-secret

  useGlobalAffinity: false
  affinity: {}
  priorityClassName: ""
  topologySpreadConstraints: []
  extraEgressRules: []
  extraIngressRules: []

# -- The console web UI: the thoras chart's dashboard image, switched to
# console mode by the config.json this chart serves.
consoleDashboard:
  enabled: true
  replicas: 1

  # Repository is joined to imageCredentials.registry; imageTag overrides
  # consoleVersion.
  image:
    repository: thoras-dashboard-v2
  imageTag: ""

  containerPort: 8080
  port: 80

  # -- The dashboard URL printed after install. Worked out from ingress when
  # unset.
  externalUrl: ""

  # -- Merged into config.json's extra block.
  extras: {}

  serviceAccount:
    name: thoras-console-dashboard

  service:
    type: ""
    annotations: {}

  labels: {}
  podAnnotations: {}

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # minAvailable takes precedence over maxUnavailable if both are set.
  pdb:
    enabled: false
    maxUnavailable: 1
    # minAvailable:

  ingress:
    enabled: false
    ingressClassName: "nginx"
    annotations: {}
    hosts:
      - host: console.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  gatewayAPI:
    enabled: false
    annotations: {}
    parentRefs:
      - name: gateway
        namespace: default
    hostnames:
      - console.local
    path: /
    pathType: PathPrefix

  useGlobalAffinity: false
  affinity: {}
  priorityClassName: ""
  topologySpreadConstraints: []
  extraEgressRules: []
  extraIngressRules: []

# -- Generates the credentials you don't supply into the
# thoras-console-config-controller Secret, and restarts their consumers when
# they change.
consoleConfigController:
  # Can be disabled only when every credential is set or referenced.
  enabled: true

  serviceAccount:
    name: thoras-console-config-controller

  replicas: 1
  labels: {}
  podAnnotations: {}

  service:
    annotations: {}

  pdb:
    enabled: false
    maxUnavailable: 1
    # minAvailable:

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

  logLevel: ""

  prometheus:
    enabled: true
    port: 9103

  pprof:
    enabled: false

  # Off: only drive rollouts, generating nothing.
  enableSeeding: true
  # Off: log the restarts it would make, but never evict a pod.
  enableRestartRollouts: true
  pollInterval: "30s"
  # How long to wait after a change before restarting.
  rolloutDebounce: "10s"
  # Per-workload deadline for eviction and readiness.
  rolloutTimeout: "5m"

  # Restarted in order, each Ready before the next; unlisted workloads go last.
  restartOrder:
    - thoras-console-api
  # Never restarted. Postgres keeps the password it was created with, so a
  # restart can't change it.
  restartExclude:
    - thoras-console-config-controller
    - thoras-console-db

  useGlobalAffinity: false
  affinity: {}
  priorityClassName: ""
  topologySpreadConstraints: []
  extraEgressRules: []
  extraIngressRules: []

# -- TimescaleDB, bundled for EVALUATION ONLY: no backups, no high
# availability, and its volume is DELETED with the release. Configuring
# externalDatabase replaces it.
bundledDatabase:
  # Defaults to true. Left unwritten so the chart can tell unset from explicit.
  # enabled: true

  image:
    repository: timescaledb
  imageTag: "2.28.2-pg16"

  # -- Extension version console-api upgrades to. Keep it matching imageTag.
  extensionVersion: "2.28.2"

  containerPort: 5432

  # -- Created on first start.
  databaseName: thoras_cloud

  # Sized for evaluation, not for load.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

  persistence:
    size: 10Gi
    # Empty uses the default StorageClass.
    storageClassName: ""

  serviceAccount:
    name: thoras-console-db

  labels: {}
  podAnnotations: {}

  useGlobalAffinity: false
  affinity: {}
  priorityClassName: ""
  extraEgressRules: []
  extraIngressRules: []

# -- Your own Postgres, with the timescaledb and citext extensions available.
# Stock Postgres will not work.
externalDatabase:
  # -- Secret holding the full DSN, database name included. The DSN carries a
  # password, so it can't be set in values.
  existingSecret:
    secretName: ""
    dsnKey: postgresql-dsn

slack:
  # -- Report console errors to Slack.
  errorsEnabled: false

  # -- Incoming webhook URL. Secret material.
  webhookUrl: ""

  # -- Read it from your own Secret. Mutually exclusive with webhookUrl.
  existingSecret:
    secretName: ""
    webhookUrlKey: slack-webhook-url
