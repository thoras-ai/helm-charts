apiVersion: v2
name: thoras-console
description: Helm chart to install the Thoras console
type: application

# App version is managed as consoleVersion in values.yaml, so the image tag can
# move without a chart bump.

# This is the chart version, following Semantic Versioning (https://semver.org/).
# Merging a change to it starts a chart release, so change it only in a release PR.
version: 1.2.0
