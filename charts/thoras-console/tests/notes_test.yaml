suite: Install Notes
templates:
  - NOTES.txt
tests:
  - it: Names the namespace it installed into
    asserts:
      - matchRegex:
          path: raw
          pattern: "Thoras console installed in namespace NAMESPACE"

  - it: Offers a port-forward until the dashboard is exposed
    asserts:
      - matchRegex:
          path: raw
          pattern: "Console URL \\(for people\\): NOT CONFIGURED"
      - matchRegex:
          path: raw
          pattern: "kubectl port-forward svc/thoras-console-dashboard 8080:80"

  - it: Prints the configured URL once there is one
    set:
      consoleApi.externalUrl: https://console.example.com
    asserts:
      - matchRegex:
          path: raw
          pattern: "Console URL \\(for people\\): https://console.example.com"
      - notMatchRegex:
          path: raw
          pattern: "Console URL \\(for people\\): NOT CONFIGURED"

  - it: Takes the console URL from the dashboard ingress when there is no externalUrl
    set:
      consoleDashboard.ingress.enabled: true
      consoleDashboard.ingress.hosts:
        - host: console.example.com
          paths:
            - path: /
    asserts:
      - matchRegex:
          path: raw
          pattern: "Console URL \\(for people\\): https://console.example.com"

  - it: Says so when nothing serves the UI
    set:
      consoleDashboard.enabled: false
    asserts:
      - matchRegex:
          path: raw
          pattern: "Console URL \\(for people\\): NO DASHBOARD"

  # A console with no ingest route serves a UI and never receives data, so the
  # notes have to say which host clusters sync to -- it is not the console URL.
  - it: Warns that no cluster can reach the console until ingest is exposed
    asserts:
      - matchRegex:
          path: raw
          pattern: "Ingest URL \\(for clusters\\): NOT CONFIGURED"

  - it: Prints the ingest URL and separates it from the console URL
    set:
      consoleApi.ingress.enabled: true
      consoleApi.ingress.hosts:
        - host: api.console.example.com
          paths:
            - path: /
    asserts:
      - matchRegex:
          path: raw
          pattern: "Ingest URL \\(for clusters\\): https://api.console.example.com"
      - matchRegex:
          path: raw
          pattern: "cloudSync.baseUrl=https://api.console.example.com"

  # Nothing in the chart can register these; a missing callback fails sign-in
  # at the redirect with an error from the provider, not from us.
  - it: Spells out the OIDC callbacks the provider needs
    set:
      consoleApi.auth.mode: oidc
      consoleApi.auth.oidc.issuer: https://id.example.com/
      consoleApi.auth.oidc.audiences: https://console.example.com
      consoleDashboard.auth.clientId: abc123
      consoleDashboard.ingress.enabled: true
      consoleDashboard.ingress.hosts:
        - host: console.example.com
          paths:
            - path: /
    asserts:
      - matchRegex:
          path: raw
          pattern: "callback   https://console.example.com/landing"
      - matchRegex:
          path: raw
          pattern: "logout     https://console.example.com"

  ############################
  # The generated password has to be retrievable
  ############################
  - it: Tells the operator how to read a generated password out
    asserts:
      - matchRegex:
          path: raw
          pattern: "kubectl get secret thoras-console-config-controller"
      - matchRegex:
          path: raw
          pattern: "jsonpath='\\{.data.local-admin-password\\}'"
      - matchRegex:
          path: raw
          pattern: "appears once config-controller has generated it"

  - it: Points at the operator's own Secret when one is referenced
    set:
      consoleApi.auth.existingSecret.secretName: console-admin
    asserts:
      - matchRegex:
          path: raw
          pattern: "kubectl get secret console-admin"
      # Nothing to wait for when the operator supplied it themselves.
      - notMatchRegex:
          path: raw
          pattern: "appears once config-controller"

  - it: Says nothing about a password in oidc mode
    set:
      consoleApi.auth.mode: oidc
      consoleApi.auth.oidc.issuer: https://id.example.com/
      consoleApi.auth.oidc.audiences: https://console.example.com
    asserts:
      - matchRegex:
          path: raw
          pattern: "Authentication: OIDC"
      - notMatchRegex:
          path: raw
          pattern: "kubectl get secret"

  - it: Warns that an unset salt falls back to a shared value
    asserts:
      - matchRegex:
          path: raw
          pattern: "adminSalt is unset"

  - it: Stops warning once a salt is set
    set:
      consoleApi.auth.adminSalt: sixteencharacter
    asserts:
      - notMatchRegex:
          path: raw
          pattern: "adminSalt is unset"

  ############################
  # The bundled database's caveats, per AC 9
  ############################
  - it: Labels the bundled database evaluation-only and says why
    asserts:
      - matchRegex:
          path: raw
          pattern: "Database: BUNDLED -- EVALUATION ONLY"
      - matchRegex:
          path: raw
          pattern: "No backups, no point-in-time recovery, no high availability"
      - matchRegex:
          path: raw
          pattern: "volume is DELETED with the release"
      - matchRegex:
          path: raw
          pattern: "pg_dump -U postgres thoras_cloud"

  - it: Describes the extension requirement instead for an external database
    set:
      externalDatabase.existingSecret.secretName: console-db
    asserts:
      - matchRegex:
          path: raw
          pattern: "Database: EXTERNAL"
      - matchRegex:
          path: raw
          pattern: "timescaledb and citext extensions must be available"
      - notMatchRegex:
          path: raw
          pattern: "EVALUATION ONLY"

  ############################
  # First-install guidance
  ############################
  - it: Explains the CreateContainerConfigError window so it does not read as broken
    release:
      upgrade: false
    asserts:
      - matchRegex:
          path: raw
          pattern: "CreateContainerConfigError until"
      - matchRegex:
          path: raw
          pattern: "no action is needed"

  - it: Points at the next step, connecting a cluster
    release:
      upgrade: false
    asserts:
      - matchRegex:
          path: raw
          pattern: "connect a cluster"
      - matchRegex:
          path: raw
          pattern: "cloudSync.baseUrl"

  - it: Flags missing image credentials
    asserts:
      - matchRegex:
          path: raw
          pattern: "Image pull credentials: NOT CONFIGURED"

  - it: Stops flagging them once a license key is set
    set:
      imageCredentials.password: license-key
    asserts:
      - notMatchRegex:
          path: raw
          pattern: "Image pull credentials: NOT CONFIGURED"
