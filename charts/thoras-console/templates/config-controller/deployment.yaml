{{- if .Values.consoleConfigController.enabled }}
{{- $cc := .Values.consoleConfigController }}
{{- $provided := include "thoras-console.providedSecretSources" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thoras-console-config-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras-console.resourceLabels" (dict "root" . "component" $cc.labels) | nindent 4 }}
spec:
  replicas: {{ $cc.replicas }}
  selector:
    matchLabels:
      app: thoras-console-config-controller
  template:
    metadata:
      labels:
        app: thoras-console-config-controller
        {{- with include "thoras-console.componentLabels" (dict "root" $ "component" $cc.labels) }}
        {{- . | trim | nindent 8 }}
        {{- end }}
      annotations:
        {{- /* Hashes the config body and the projected sources, not the
               rendered ConfigMap: chart-label churn would otherwise roll this
               on every upgrade. */}}
        checksum/config: {{ printf "%s\n%s" (include "thoras-console.configControllerConfig" .) $provided | sha256sum }}
        {{- if $cc.prometheus.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ $cc.prometheus.port | quote }}
        {{- end }}
        {{- with include "thoras-console.podAnnotations" (dict "root" $ "component" $cc.podAnnotations) }}
        {{- . | trim | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534 # user: nobody
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ $cc.serviceAccount.name }}
      {{- if and .Values.imageCredentials.imagePullSecretInDeployment .Values.imageCredentials.secretRef }}
      imagePullSecrets:
      - name: {{ .Values.imageCredentials.secretRef }}
      {{- end }}
      volumes:
      - name: config
        configMap:
          name: thoras-console-config-controller-config
      {{- with $provided }}
      - name: provided
        projected:
          sources:
            {{- . | nindent 12 }}
      {{- end }}
      containers:
      {{- /* Same image as console-api, different command: the config-controller
             binary ships in it so the chart tracks one image and one version. */}}
      - image: {{ .Values.imageCredentials.registry }}/{{ .Values.consoleApi.image.repository }}:{{ .Values.consoleVersion }}
        imagePullPolicy: "{{ .Values.imagePullPolicy }}"
        name: thoras-console-config-controller
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command: ["/app/config-controller"]
        env:
          - name: SERVICE_CONFIG_PATH
            value: /app/config-controller.yaml
          - name: SERVICE_THORAS_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          {{- /* Pinned to the release namespace so the informer cache matches
                 the namespaced Role in rbac.yaml. */}}
          - name: SERVICE_WATCH_NAMESPACES
            value: {{ .Release.Namespace | quote }}
          {{- /* The binary defaults this to app.kubernetes.io/name=thoras, which
                 matches nothing in this chart. Without the override seeding
                 still works and rollouts silently never happen. */}}
          - name: SERVICE_WORKLOAD_SELECTOR
            value: "app.kubernetes.io/name={{ .Chart.Name }}"
          - name: SERVICE_ENABLE_SEEDING
            value: {{ $cc.enableSeeding | ternary "true" "false" | quote }}
          - name: SERVICE_ENABLE_RESTART_ROLLOUTS
            value: {{ $cc.enableRestartRollouts | ternary "true" "false" | quote }}
          - name: SERVICE_POLL_INTERVAL
            value: {{ $cc.pollInterval | quote }}
          - name: SERVICE_ROLLOUT_DEBOUNCE
            value: {{ $cc.rolloutDebounce | quote }}
          - name: SERVICE_ROLLOUT_TIMEOUT
            value: {{ $cc.rolloutTimeout | quote }}
          - name: SERVICE_PORT
            value: {{ $cc.prometheus.port | quote }}
          - name: SERVICE_ENABLE_PPROF
            value: {{ $cc.pprof.enabled | ternary "true" "false" | quote }}
          - name: SERVICE_LOG_LEVEL
            value: {{ default .Values.logLevel $cc.logLevel }}
          - name: SERVICE_CHART_VERSION
            value: {{ .Chart.Version | quote }}
          - name: SERVICE_SLACK_ERRORS_ENABLED
            value: {{ .Values.slack.errorsEnabled | ternary "true" "false" | quote }}
          {{- with include "thoras-console.slackEnv" . }}{{- . | nindent 10 }}{{- end }}
          {{- with include "thoras-console.globalEnv" . }}{{- . | nindent 10 }}{{- end }}
        ports:
          - name: http-metrics
            containerPort: {{ $cc.prometheus.port }}
          {{- /* Fixed in the binary; not configurable. */}}
          - name: http-health
            containerPort: 8081
        startupProbe:
          httpGet:
            path: /readyz
            port: http-health
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-health
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-health
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 2
        resources: {{ $cc.resources | toYaml | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /app/config-controller.yaml
          subPath: config-controller.yaml
          readOnly: true
        {{- if $provided }}
        - name: provided
          mountPath: /etc/thoras/provided
          readOnly: true
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $cc.useGlobalAffinity }}
        {{- $globalAffinity := .Values.affinity | default dict | deepCopy }}
        {{- $componentAffinity := $cc.affinity | default dict | deepCopy }}
        {{- $mergedAffinity := mustMerge dict $globalAffinity $componentAffinity }}
        {{- with $mergedAffinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
        {{- with $cc.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with $cc.priorityClassName | default .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- include "thoras-console.topologySpreadConstraints" (dict "root" . "component" $cc.topologySpreadConstraints) | nindent 6 }}
{{- end }}
