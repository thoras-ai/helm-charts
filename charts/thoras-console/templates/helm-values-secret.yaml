{{- /* Secret for credentials pinned in values, and the chart's validation
       chokepoint via thoras-console.validate below.

       Fully deterministic: no `lookup`, no generation, so `helm template` and
       Argo CD render exactly what a cluster apply produces.

       Values left empty are not stored here. They are generated into
       `thoras-console-config-controller` by config-controller instead, or read
       straight from a Secret you manage.

       Changing a value here does not roll consumers by itself: config-controller
       observes the change and evicts the consuming pods in tier order. */}}

{{- /* Guards live in a helper so they run whatever order Helm renders in:
       templates that resolve a secret ref would otherwise fail first, with a
       worse message. */}}
{{- include "thoras-console.validate" . }}

{{- with include "thoras-console.helmSecretValuesKeys" . | fromYaml }}
---
apiVersion: v1
kind: Secret
metadata:
  name: thoras-console-helm-values
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "thoras-console.resourceLabels" (dict "root" $) | nindent 4 }}
data:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
