{{- if and .Values.imageCredentials.password .Values.imageCredentials.secretRef }}
{{- fail "Error: Both '.Values.imageCredentials.password' and '.Values.imageCredentials.secretRef' are set, but only one should be defined" }}
{{- end }}
{{- if .Values.imageCredentials.password }}
---
apiVersion: v1
kind: Secret
{{- /* Named apart from the thoras chart's thoras-secret-registry so both can
       share a namespace. */}}
metadata:
  name: thoras-console-secret-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras-console.resourceLabels" (dict "root" .) | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "thoras-console.imagePullSecret" . }}
{{- end }}
