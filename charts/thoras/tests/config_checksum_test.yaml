suite: Config Checksum Annotations
# The chart hashes the ConfigMaps each workload mounts so a config edit rolls
# its consumers. config-controller cannot do this for chart-owned ConfigMaps:
# stamping the workload spec is what GitOps tools revert as drift.
#
# Assertions here check shape only (sha256 hex) rather than pinned values.
# Pinning bytes turned every edit to _config-data.tpl into a manual hash-copy
# chore without adding real coverage; helm-unittest cannot diff two renders
# inside one `it:` block, so differential invariants ("editing content rolls
# the workload", "labels do not leak in") are enforced by template review
# instead. See _config-data.tpl for the hashing contract.
templates:
  - api-server-v2/deployment.yaml
  - worker/deployment.yaml
  - collector/deployment.yaml
  - dashboard/deployment.yaml
  - config-controller/deployment.yaml
  - operator/deployment.yaml
tests:
  - it: Every workload that mounts a chart ConfigMap carries one hex checksum
    templates:
      - api-server-v2/deployment.yaml
      - worker/deployment.yaml
      - collector/deployment.yaml
      - dashboard/deployment.yaml
      - config-controller/deployment.yaml
    set:
      thorasConfigController:
        enabled: true
      metricsCollector:
        timescale:
          config:
            enabled: true
            content: "shared_buffers=1GB"
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations['checksum/config']
          pattern: ^[0-9a-f]{64}$

  - it: api-server-v2 and worker both stamp a hex checksum from the monitor ConfigMap
    templates:
      - api-server-v2/deployment.yaml
      - worker/deployment.yaml
    set:
      thorasMonitor:
        config: |
          shared: value
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations['checksum/config']
          pattern: ^[0-9a-f]{64}$

  - it: Chart label churn still renders a hex checksum
    # The hash covers ConfigMap data only. Were it over the rendered object,
    # every chart version bump would roll every workload. This test proves the
    # annotation stays well-formed under extra labels; the "labels do not feed
    # the hash" invariant is guaranteed by _config-data.tpl reading only
    # .Values.thorasMonitor.config.
    templates:
      - api-server-v2/deployment.yaml
      - worker/deployment.yaml
    set:
      labels:
        someLabel: someValue
      thorasMonitor:
        config: |
          shared: value
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations['checksum/config']
          pattern: ^[0-9a-f]{64}$

  - it: Collector has no checksum when it mounts no timescale ConfigMap
    template: collector/deployment.yaml
    set:
      metricsCollector:
        podAnnotations: {}
        timescale:
          config:
            enabled: false
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: Collector has no checksum when timescale is external
    template: collector/deployment.yaml
    set:
      metricsCollector:
        podAnnotations: {}
        timescale:
          config:
            enabled: true
            content: "shared_buffers=1GB"
      externalTimescale:
        dsn: postgres://example
    asserts:
      - notExists:
          path: spec.template.metadata.annotations['checksum/config']

  - it: Dashboard stamps a hex checksum when auth is on
    template: dashboard/deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations['checksum/config']
          pattern: ^[0-9a-f]{64}$

  - it: Dashboard stamps a hex checksum when auth is off
    template: dashboard/deployment.yaml
    set:
      thorasDashboard:
        auth:
          enabled: false
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations['checksum/config']
          pattern: ^[0-9a-f]{64}$

  - it: Operator has no checksum despite mounting a chart ConfigMap
    # thoras-operator-system-config is deliberately exempt. Its chart content is
    # static, so a hash over it would be a constant that never rolls anything.
    # The value is written at runtime by the api-server, which restarts the
    # operator itself rather than relying on a template annotation.
    templates:
      - operator/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.annotations['checksum/config']

  - it: Dashboard stamps a hex checksum when cluster.name reaches nginx.conf
    template: dashboard/deployment.yaml
    set:
      cluster:
        name: prod-east
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations['checksum/config']
          pattern: ^[0-9a-f]{64}$
