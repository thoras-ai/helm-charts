suite: Global labels applied
templates:
  - "*/deployment.yaml"
  - "*/service-account.yaml"
  - "*/rbac.yaml"
  - "*/service.yaml"
set:
  thorasVersion: TEST
  imageCredentials:
    secretRef: test-secret-registry
  # Enable all deployments
  thorasForecast:
    worker:
      enabled: true
  thorasMonitor:
    unittesting: true
  thorasDashboard:
    unittesting: true
    # TODO: keep this snapshot pinned to the pre-auth shape until we're ready
    # to update it. Auth-on shape is covered in dashboard_auth_test.yaml.
    auth:
      enabled: false
  thorasSlmAgent:
    enabled: true
  labels:
    globalLabel: globalValue
tests:
  - it: Default matches snapshot
    chart:
      version: "4.7.0"
    release:
      namespace: foo
    asserts:
      - matchSnapshot: {}
