suite: DashboardAuth
tests:
  # -------- Auth Secret --------

  - it: Does not render the auth Secret when auth is disabled
    templates:
      - dashboard/auth-secret.yaml
    set:
      thorasDashboard:
        auth:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Renders the auth Secret with generated values by default
    templates:
      - dashboard/auth-secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: thoras-dashboard-auth
      - equal:
          path: data.username
          # base64 of "thoras"
          value: dGhvcmFz
      - matchRegex:
          # base64 of a 24-character randAlphaNum (24 bytes -> 32 chars, no padding)
          path: data.password
          pattern: "^[A-Za-z0-9+/]{32}$"
      - matchRegex:
          # base64 of a 32-character randAlphaNum cookie secret
          path: data["cookie-secret"]
          pattern: "^[A-Za-z0-9+/]+=*$"

  - it: Uses an explicitly configured password
    templates:
      - dashboard/auth-secret.yaml
    set:
      thorasDashboard:
        auth:
          password: hunter2
    asserts:
      - equal:
          path: data.password
          # base64 of "hunter2"
          value: aHVudGVyMg==

  - it: Uses an explicitly configured username
    templates:
      - dashboard/auth-secret.yaml
    set:
      thorasDashboard:
        auth:
          username: admin
    asserts:
      - equal:
          path: data.username
          # base64 of "admin"
          value: YWRtaW4=

  # -------- oauth2-proxy ConfigMap --------

  - it: Does not render the oauth2-proxy ConfigMap when auth is disabled
    templates:
      - dashboard/oauth2-proxy-config-map.yaml
    set:
      thorasDashboard:
        auth:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Renders an oauth2-proxy config that prefers the htpasswd form
    templates:
      - dashboard/oauth2-proxy-config-map.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: thoras-dashboard-oauth2-proxy-config
      - matchRegex:
          path: data["oauth2-proxy.cfg"]
          pattern: 'htpasswd_file = "/etc/oauth2-proxy/generated/htpasswd"'
      - matchRegex:
          path: data["oauth2-proxy.cfg"]
          pattern: "display_htpasswd_form = true"
      # Regression guard: skip_provider_button must NOT be set. It skips the
      # sign-in page and jumps to /oauth2/start, which fails against the
      # dummy Google provider. See the NOTE in oauth2-proxy-config-map.yaml.
      - notMatchRegex:
          path: data["oauth2-proxy.cfg"]
          pattern: "skip_provider_button = true"
      - matchRegex:
          path: data["oauth2-proxy.cfg"]
          pattern: "cookie_secure = true"
      - matchRegex:
          path: data["oauth2-proxy.cfg"]
          pattern: 'upstreams = \["http://127.0.0.1:8080"\]'
      - matchRegex:
          path: data["oauth2-proxy.cfg"]
          pattern: 'http_address = "0.0.0.0:4180"'

  - it: Reflects cookieSecure=false in the oauth2-proxy config
    templates:
      - dashboard/oauth2-proxy-config-map.yaml
    set:
      thorasDashboard:
        auth:
          cookieSecure: false
    asserts:
      - matchRegex:
          path: data["oauth2-proxy.cfg"]
          pattern: "cookie_secure = false"

  # -------- Dashboard Deployment --------

  - it: Does not add an oauth2-proxy sidecar when auth is disabled
    templates:
      - dashboard/deployment.yaml
    set:
      thorasDashboard:
        unittesting: true
        auth:
          enabled: false
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - notExists:
          path: spec.template.spec.initContainers
      - notExists:
          path: spec.template.spec.volumes[?(@.name == 'oauth2-proxy-config')]

  - it: Adds the oauth2-proxy sidecar, init container, and volumes when enabled
    templates:
      - dashboard/deployment.yaml
    set:
      thorasDashboard:
        unittesting: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[?(@.name == 'oauth2-proxy')].image
          value: quay.io/oauth2-proxy/oauth2-proxy:v7.15.0
      - equal:
          path: spec.template.spec.containers[?(@.name == 'oauth2-proxy')].ports[0].containerPort
          value: 4180
      - equal:
          path: spec.template.spec.containers[?(@.name == 'oauth2-proxy')].args
          value:
            - --config=/etc/oauth2-proxy/config/oauth2-proxy.cfg
      - equal:
          path: spec.template.spec.containers[?(@.name == 'oauth2-proxy')].livenessProbe.httpGet.path
          value: /ping
      - equal:
          path: spec.template.spec.containers[?(@.name == 'oauth2-proxy')].readinessProbe.httpGet.path
          value: /ready
      - contains:
          path: spec.template.spec.containers[?(@.name == 'oauth2-proxy')].volumeMounts
          content:
            name: oauth2-proxy-config
            mountPath: /etc/oauth2-proxy/config
            readOnly: true
      - contains:
          path: spec.template.spec.containers[?(@.name == 'oauth2-proxy')].volumeMounts
          content:
            name: oauth2-proxy-secret
            mountPath: /etc/oauth2-proxy/secret
            readOnly: true
      - contains:
          path: spec.template.spec.containers[?(@.name == 'oauth2-proxy')].volumeMounts
          content:
            name: oauth2-proxy-generated
            mountPath: /etc/oauth2-proxy/generated
            readOnly: true
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[?(@.name == 'htpasswd-init')].env[?(@.name == 'AUTH_USERNAME')].valueFrom.secretKeyRef.name
          value: thoras-dashboard-auth
      - equal:
          path: spec.template.spec.initContainers[?(@.name == 'htpasswd-init')].env[?(@.name == 'AUTH_USERNAME')].valueFrom.secretKeyRef.key
          value: username
      - equal:
          path: spec.template.spec.initContainers[?(@.name == 'htpasswd-init')].env[?(@.name == 'AUTH_PASSWORD')].valueFrom.secretKeyRef.key
          value: password
      - contains:
          path: spec.template.spec.volumes
          content:
            name: oauth2-proxy-config
            configMap:
              name: thoras-dashboard-oauth2-proxy-config

  # Regression guard for the reason we chose oauth2-proxy over nginx auth_basic
  # in the first place: the dashboard container's probes must keep hitting the
  # nginx port directly and bypass the sidecar, otherwise they 401 and the pod
  # crash-loops. See the "Probes will 401" gotcha in issue #4980.
  - it: Keeps dashboard container probes on the nginx port when auth is enabled
    templates:
      - dashboard/deployment.yaml
    set:
      thorasDashboard:
        unittesting: true
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].startupProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].ports[0].containerPort
          value: 8080

  - it: Rolls the dashboard pod when auth Secret or oauth2-proxy config changes
    templates:
      - dashboard/deployment.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/auth-secret"]
      - exists:
          path: spec.template.metadata.annotations["checksum/oauth2-proxy-config"]

  - it: Applies extraArgs to the sidecar
    templates:
      - dashboard/deployment.yaml
    set:
      thorasDashboard:
        unittesting: true
        auth:
          extraArgs:
            - --skip-jwt-bearer-tokens=true
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == 'oauth2-proxy')].args
          content: --skip-jwt-bearer-tokens=true

  # -------- Service --------

  - it: Points the Service at the sidecar port by default when auth is enabled
    templates:
      - dashboard/service.yaml
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: 4180

  - it: Points the Service at containerPort when auth is disabled
    templates:
      - dashboard/service.yaml
    set:
      thorasDashboard:
        auth:
          enabled: false
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: 8080

  - it: Explicit service.targetPort still wins over the auth sidecar port
    templates:
      - dashboard/service.yaml
    set:
      thorasDashboard:
        service:
          targetPort: 9999
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: 9999

  # -------- NetworkPolicy --------

  - it: Opens the sidecar port in the NetworkPolicy when auth is enabled
    templates:
      - dashboard/network-policy.yaml
    set:
      networkPolicy:
        enabled: true
    asserts:
      - contains:
          path: spec.ingress[1].toPorts[0].ports
          content:
            port: "4180"
            protocol: TCP

  - it: Opens the nginx port in the NetworkPolicy when auth is disabled
    templates:
      - dashboard/network-policy.yaml
    set:
      networkPolicy:
        enabled: true
      thorasDashboard:
        auth:
          enabled: false
    asserts:
      - contains:
          path: spec.ingress[1].toPorts[0].ports
          content:
            port: "8080"
            protocol: TCP
