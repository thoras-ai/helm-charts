suite: Image Pull Secrets
templates:
  - "*/deployment.yaml"
  - "agent/daemonset.yaml"
set:
  thorasLicenseKey: "test-license"
  # Enable all optional deployments
  thorasForecast:
    worker:
      enabled: true
  thorasMonitor:
    unittesting: true
  thorasDashboard:
    unittesting: true
  thorasSlmAgent:
    enabled: true
tests:
  - it: Should have imagePullSecrets pointing at the operator-provided Secret when set
    set:
      imageCredentials:
        imagePullSecretInDeployment: true
        existingSecret:
          secretName: "my-registry-secret"
    asserts:
      - exists:
          path: spec.template.spec.imagePullSecrets
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: "my-registry-secret"

  - it: Should have imagePullSecrets pointing at the chart-seeded Secret when only the license key is set
    set:
      imageCredentials:
        imagePullSecretInDeployment: true
    asserts:
      - exists:
          path: spec.template.spec.imagePullSecrets
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: "thoras-secret-registry"

  - it: Should NOT have PodSpec-level imagePullSecrets when imagePullSecretInDeployment is false
    set:
      imageCredentials:
        imagePullSecretInDeployment: false
        existingSecret:
          secretName: "my-registry-secret"
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: Should NOT have PodSpec-level imagePullSecrets when the flag is unset
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
