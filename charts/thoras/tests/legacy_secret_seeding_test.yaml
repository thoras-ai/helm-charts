suite: LegacySecretSeeding
tests:
  - it: Renders both legacy Secrets by default
    templates:
      - api-client-secret.yaml
      - collector/secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret

  - it: Renders neither legacy Secret when the flag is off
    templates:
      - api-client-secret.yaml
      - collector/secret.yaml
    set:
      featureFlags:
        enableLegacySecretSeeding: false
    asserts:
      - hasDocuments:
          count: 0

  # Helm refreshes from the cluster before it consults the resource policy, so
  # these annotations have to reach the live objects one release before the
  # templates are deleted in 6.0. That also means they must render
  # unconditionally, with no lookup or IsUpgrade gate, or Argo CD would never
  # apply them.
  - it: Protects both legacy Secrets from deletion and Argo pruning
    templates:
      - api-client-secret.yaml
      - collector/secret.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false

  - it: Drops api-client-secret when the api client is disabled
    templates:
      - api-client-secret.yaml
    set:
      apiClientSecret:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Drops thoras-timescale-password when the DSN comes from a customer Secret
    templates:
      - collector/secret.yaml
    set:
      externalTimescale:
        secretRefName: my-db
        secretRefKey: dsn
    asserts:
      - hasDocuments:
          count: 0

  - it: Stores only the DSN under an external TimescaleDB
    templates:
      - collector/secret.yaml
    set:
      externalTimescale:
        dsn: "postgres://user:pass@ext-db:5432/tsdb"
    asserts:
      - notExists:
          path: data.password
      - exists:
          path: data.host

  # config-controller cross-checks the pair on migration and refuses to write
  # either value if the DSN does not embed the password.
  - it: Keeps the password and the DSN it is embedded in together
    templates:
      - collector/secret.yaml
    asserts:
      - exists:
          path: data.password
      - matchRegex:
          path: data.host
          # base64 of "postgres://postgre", the stable prefix of the DSN
          pattern: "^cG9zdGdyZXM6Ly9wb3N0Z3Jl"

  # The legacy Secrets are migration sources only; nothing reads them.
  - it: Leaves no consumer pointing at the legacy Secrets
    templates:
      - api-server-v2/deployment.yaml
      - operator/deployment.yaml
      - worker/deployment.yaml
      - collector/deployment.yaml
      - dashboard/deployment.yaml
    asserts:
      - notMatchRegex:
          path: $..spec.containers[*].env[*].valueFrom.secretKeyRef.name
          pattern: "^(api-client-secret|thoras-timescale-password)$"

  # Turning the flag off is a one-way door: config-controller stops adopting
  # the legacy values and will seed fresh ones on next reconcile.
  - it: Stops migrating from the legacy Secrets when the flag is off
    templates:
      - config-controller/configmap.yaml
    set:
      featureFlags:
        enableLegacySecretSeeding: false
    asserts:
      - notMatchRegex:
          path: data["config-controller.yaml"]
          pattern: "secret: api-client-secret"
      - notMatchRegex:
          path: data["config-controller.yaml"]
          pattern: "secret: thoras-timescale-password"

  - it: Grants read access to exactly the Secrets it migrates from
    templates:
      - config-controller/rbac.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: rules[?(@.verbs[0] == 'get')].resourceNames
          value:
            - api-client-secret
            - thoras-config-controller
            - thoras-timescale-password

  - it: Shrinks the read grant to the managed Secret when the flag is off
    templates:
      - config-controller/rbac.yaml
    documentIndex: 0
    set:
      featureFlags:
        enableLegacySecretSeeding: false
    asserts:
      - equal:
          path: rules[?(@.verbs[0] == 'get')].resourceNames
          value:
            - thoras-config-controller
