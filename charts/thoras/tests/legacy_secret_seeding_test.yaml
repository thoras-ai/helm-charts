suite: LegacySecretSeeding
tests:
  - it: Renders neither legacy Secret by default
    templates:
      - api-client-secret.yaml
      - collector/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: Renders both legacy Secrets when the flag is on
    templates:
      - api-client-secret.yaml
      - collector/secret.yaml
    set:
      featureFlags:
        enableLegacySecretSeeding: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret

  # --reuse-values from a release that predates the flag.
  - it: Renders neither legacy Secret when the flag is missing from stored values
    templates:
      - api-client-secret.yaml
      - collector/secret.yaml
    set:
      featureFlags.enableLegacySecretSeeding: null
    asserts:
      - hasDocuments:
          count: 0

  # Helm refreshes from the cluster before it consults the resource policy, so
  # these annotations have to reach the live objects one release before the
  # templates are deleted in 6.0. That also means they must render
  # unconditionally, with no lookup or IsUpgrade gate, or Argo CD would never
  # apply them.
  - it: Protects both legacy Secrets from deletion and Argo pruning
    templates:
      - api-client-secret.yaml
      - collector/secret.yaml
    set:
      featureFlags:
        enableLegacySecretSeeding: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false

  - it: Drops api-client-secret when the api client is disabled
    templates:
      - api-client-secret.yaml
    set:
      featureFlags:
        enableLegacySecretSeeding: true
      apiClientSecret:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Drops thoras-timescale-password when the DSN comes from a customer Secret
    templates:
      - collector/secret.yaml
    set:
      featureFlags:
        enableLegacySecretSeeding: true
      externalTimescale:
        secretRefName: my-db
        secretRefKey: dsn
    asserts:
      - hasDocuments:
          count: 0

  - it: Stores only the DSN under an external TimescaleDB
    templates:
      - collector/secret.yaml
    set:
      featureFlags:
        enableLegacySecretSeeding: true
      externalTimescale:
        dsn: "postgres://user:pass@ext-db:5432/tsdb"
    asserts:
      - notExists:
          path: data.password
      - exists:
          path: data.host

  # config-controller cross-checks the pair on migration and refuses to write
  # either value if the DSN does not embed the password.
  - it: Keeps the password and the DSN it is embedded in together
    templates:
      - collector/secret.yaml
    set:
      featureFlags:
        enableLegacySecretSeeding: true
    asserts:
      - exists:
          path: data.password
      - matchRegex:
          path: data.host
          # base64 of "postgres://postgre", the stable prefix of the DSN
          pattern: "^cG9zdGdyZXM6Ly9wb3N0Z3Jl"

  # The legacy Secrets are migration sources only; nothing reads them.
  - it: Leaves no consumer pointing at the legacy Secrets
    templates:
      - api-server-v2/deployment.yaml
      - operator/deployment.yaml
      - worker/deployment.yaml
      - collector/deployment.yaml
      - dashboard/deployment.yaml
    set:
      featureFlags:
        enableLegacySecretSeeding: true
    asserts:
      - notMatchRegex:
          path: $..spec.containers[*].env[*].valueFrom.secretKeyRef.name
          pattern: "^(api-client-secret|thoras-timescale-password)$"

  # With no migration pending, config-controller seeds fresh values.
  - it: Does not migrate from the legacy Secrets by default
    templates:
      - config-controller/configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["config-controller.yaml"]
          pattern: "secret: api-client-secret"
      - notMatchRegex:
          path: data["config-controller.yaml"]
          pattern: "secret: thoras-timescale-password"

  - it: Owns exactly the managed Secret and the Secrets it migrates from
    templates:
      - config-controller/rbac.yaml
    documentIndex: 0
    set:
      featureFlags:
        enableLegacySecretSeeding: true
    asserts:
      - equal:
          path: rules[?(@.verbs[0] == '*')].resourceNames
          value:
            - api-client-secret
            - thoras-config-controller
            - thoras-timescale-password

  - it: Grants only the managed Secret by default
    templates:
      - config-controller/rbac.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: rules[?(@.verbs[0] == '*')].resourceNames
          value:
            - thoras-config-controller

  # ---- Live Secrets, as `lookup` sees them on a helm upgrade ----

  # A 4.x install: the Secrets have no resource policy, so dropping them here
  # would delete them before config-controller reads them, and a new database
  # password would no longer match the running database.
  - it: Renders the live values while the migration is pending
    templates:
      - api-client-secret.yaml
      - collector/secret.yaml
    kubernetesProvider: &unmigrated
      scheme:
        "v1/Secret":
          gvr: { version: "v1", resource: "secrets" }
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata: { name: api-client-secret, namespace: NAMESPACE }
          data: { secret: bGl2ZS1hcGktY2xpZW50 }
        - kind: Secret
          apiVersion: v1
          metadata: { name: thoras-timescale-password, namespace: NAMESPACE }
          data: { password: bGl2ZS1wYXNzd29yZA== }
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: Keeps the live api client value while the migration is pending
    templates:
      - api-client-secret.yaml
    kubernetesProvider: *unmigrated
    asserts:
      - equal:
          path: data.secret
          value: bGl2ZS1hcGktY2xpZW50

  - it: Keeps the live database password while the migration is pending
    templates:
      - collector/secret.yaml
    kubernetesProvider: *unmigrated
    asserts:
      - equal:
          path: data.password
          value: bGl2ZS1wYXNzd29yZA==

  - it: Migrates from the legacy Secrets while the migration is pending
    templates:
      - config-controller/configmap.yaml
    kubernetesProvider: *unmigrated
    asserts:
      - matchRegex:
          path: data["config-controller.yaml"]
          pattern: "secret: api-client-secret"
      - matchRegex:
          path: data["config-controller.yaml"]
          pattern: "secret: thoras-timescale-password"

  - it: Owns the legacy Secrets while the migration is pending
    templates:
      - config-controller/rbac.yaml
    documentIndex: 0
    kubernetesProvider: *unmigrated
    asserts:
      - equal:
          path: rules[?(@.verbs[0] == '*')].resourceNames
          value:
            - api-client-secret
            - thoras-config-controller
            - thoras-timescale-password

  - it: Stops rendering legacy Secrets config-controller annotated as migrated
    templates:
      - api-client-secret.yaml
      - collector/secret.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: { version: "v1", resource: "secrets" }
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: api-client-secret
            namespace: NAMESPACE
            annotations: { "thoras.ai/migrated-to": thoras-config-controller/api-client-secret }
          data: { secret: bGl2ZS1hcGktY2xpZW50 }
        - kind: Secret
          apiVersion: v1
          metadata:
            name: thoras-timescale-password
            namespace: NAMESPACE
            annotations: { "thoras.ai/migrated-to": thoras-config-controller/timescale-password }
          data: { password: bGl2ZS1wYXNzd29yZA== }
    asserts:
      - hasDocuments:
          count: 0

  # Annotating the source is best effort, so the managed Secret decides too.
  - it: Stops rendering legacy Secrets whose values are already in the managed Secret
    templates:
      - api-client-secret.yaml
      - collector/secret.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: { version: "v1", resource: "secrets" }
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata: { name: api-client-secret, namespace: NAMESPACE }
          data: { secret: bGl2ZS1hcGktY2xpZW50 }
        - kind: Secret
          apiVersion: v1
          metadata: { name: thoras-timescale-password, namespace: NAMESPACE }
          data: { password: bGl2ZS1wYXNzd29yZA== }
        - kind: Secret
          apiVersion: v1
          metadata: { name: thoras-config-controller, namespace: NAMESPACE }
          data: { api-client-secret: bGl2ZS1hcGktY2xpZW50, timescale-password: bGl2ZS1wYXNzd29yZA== }
    asserts:
      - hasDocuments:
          count: 0

  - it: Leaves a live api-client-secret alone when the value is pinned
    templates:
      - api-client-secret.yaml
    set:
      apiClientSecret:
        secret: pinned-value
    kubernetesProvider: *unmigrated
    asserts:
      - hasDocuments:
          count: 0

  - it: Leaves a live thoras-timescale-password alone under an external database
    templates:
      - collector/secret.yaml
    set:
      externalTimescale:
        dsn: "postgres://user:pass@ext-db:5432/tsdb"
    kubernetesProvider: *unmigrated
    asserts:
      - hasDocuments:
          count: 0
