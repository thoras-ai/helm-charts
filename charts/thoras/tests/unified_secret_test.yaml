suite: Unified Credentials Secret
templates:
  - credentials-secret.yaml
set:
  thorasLicenseKey: "test-license"
tests:
  - it: Renders thoras-credentials by default with the expected keys
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: thoras-credentials
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false
      - exists:
          path: data["timescale-password"]
      - exists:
          path: data["api-client-secret"]
      # timescale-dsn is only seeded in external mode.
      - notExists:
          path: data["timescale-dsn"]
      # Optional integrations disabled by default.
      - notExists:
          path: data["cloud-sync-cluster-key"]
      - notExists:
          path: data["slack-webhook-url"]

  - it: Omits api-client-secret when simple auth is disabled
    set:
      featureFlags:
        enableSimpleAuthSecret: false
    asserts:
      - notExists:
          path: data["api-client-secret"]

  - it: Omits timescale-password in external Timescale mode
    set:
      externalTimescale:
        dsn: "postgres://user:pass@ext:5432/db"
    asserts:
      - notExists:
          path: data["timescale-password"]
      - equal:
          path: data["timescale-dsn"]
          value: "cG9zdGdyZXM6Ly91c2VyOnBhc3NAZXh0OjU0MzIvZGI="

  - it: Emits the cloud-sync key when cloud-sync is enabled
    set:
      cloudSync:
        clusterKeyID: "id"
        clusterKey: "abc"
        existingSecret:
          secretKey: "cloud-sync-cluster-key"
    asserts:
      - equal:
          path: data["cloud-sync-cluster-key"]
          value: "YWJj"

  - it: Emits the slack key at the operator-chosen name when Slack is enabled
    set:
      slackWebhook:
        url: "https://slack.example.com/webhook"
        existingSecret:
          secretKey: "my-custom-slack-key"
    asserts:
      - equal:
          path: data["my-custom-slack-key"]
          value: "aHR0cHM6Ly9zbGFjay5leGFtcGxlLmNvbS93ZWJob29r"

  - it: Renders no manifest when top-level existingSecret.secretName is set
    set:
      existingSecret:
        secretName: "operator-provided"
    asserts:
      - hasDocuments:
          count: 0

  - it: Still renders when only per-credential existingSecret.secretName is set (mixed mode)
    set:
      externalTimescale:
        existingSecret:
          secretName: "my-timescale"
    asserts:
      - hasDocuments:
          count: 1
      # Other credentials still seeded into thoras-credentials.
      - exists:
          path: data["api-client-secret"]

  - it: Seeds the operator-provided timescale password value when set
    set:
      metricsCollector:
        timescale:
          password: "explicit-pass"
    asserts:
      - equal:
          path: data["timescale-password"]
          value: "ZXhwbGljaXQtcGFzcw=="

  - it: Seeds the operator-provided api-client secret value when set
    set:
      apiClientSecret:
        secret: "explicit-api"
    asserts:
      - equal:
          path: data["api-client-secret"]
          value: "ZXhwbGljaXQtYXBp"

  - it: Omits timescale-password when in-cluster Timescale is delegated to a Secret
    # timescale-dsn is never seeded in in-cluster mode regardless.
    set:
      metricsCollector:
        timescale:
          existingSecret:
            secretName: "my-in-cluster-ts"
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: data["timescale-password"]
      - notExists:
          path: data["timescale-dsn"]
      # Other credentials still seeded.
      - exists:
          path: data["api-client-secret"]
