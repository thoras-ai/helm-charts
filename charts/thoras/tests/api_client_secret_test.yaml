suite: ApiClientSecret
tests:
  # ---- Three-way resolution ----
  # Unset -> seeded into thoras-config-controller.
  # Pinned in values -> stored in thoras-helm-values.
  # existingSecret -> read straight from the customer's Secret.

  - it: Leaves api-client-secret out of thoras-helm-values when unset
    templates:
      - thoras-helm-values-secret.yaml
    set:
      thorasDashboard:
        enabled: false
    asserts:
      # nothing is pinned, so the Secret is not rendered at all
      - hasDocuments:
          count: 0

  - it: Seeds api-client-secret through config-controller when unset
    templates:
      - config-controller/configmap.yaml
    asserts:
      - matchRegex:
          path: data["config-controller.yaml"]
          pattern: "- name: api-client-secret\n    source: seed"
      - matchRegex:
          path: data["config-controller.yaml"]
          pattern: "type: alphanumeric"

  - it: Migrates the legacy api-client-secret Secret
    templates:
      - config-controller/configmap.yaml
    asserts:
      - matchRegex:
          path: data["config-controller.yaml"]
          pattern: "migrateFrom:\n      - key: secret\n        secret: api-client-secret"

  - it: Stores a pinned apiClientSecret.secret in thoras-helm-values
    templates:
      - thoras-helm-values-secret.yaml
    set:
      thorasDashboard:
        enabled: false
      apiClientSecret:
        secret: hunter2
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: thoras-helm-values
      - equal:
          path: data["api-client-secret"]
          # base64 of "hunter2"
          value: aHVudGVyMg==

  - it: Reads a pinned value from a file rather than seeding it
    templates:
      - config-controller/configmap.yaml
    set:
      apiClientSecret:
        secret: hunter2
    asserts:
      - matchRegex:
          path: data["config-controller.yaml"]
          pattern: "- name: api-client-secret\n    source: provided\n    path: /etc/thoras/provided/api-client-secret"

  - it: Omits api-client-secret from thoras-helm-values when existingSecret is set
    templates:
      - thoras-helm-values-secret.yaml
    set:
      thorasDashboard:
        enabled: false
      apiClientSecret:
        existingSecret:
          secretName: my-api-client
          secretKey: token
    asserts:
      - hasDocuments:
          count: 0

  - it: Drops api-client-secret from the controller config when disabled
    templates:
      - config-controller/configmap.yaml
    set:
      apiClientSecret:
        enabled: false
    asserts:
      - notMatchRegex:
          path: data["config-controller.yaml"]
          pattern: "name: api-client-secret"

  - it: Fails when both apiClientSecret.secret and existingSecret.secretName are set
    templates:
      - thoras-helm-values-secret.yaml
    set:
      apiClientSecret:
        secret: hunter2
        existingSecret:
          secretName: my-api-client
    asserts:
      - failedTemplate:
          errorMessage: "apiClientSecret.secret and apiClientSecret.existingSecret.secretName are mutually exclusive"

  # ---- Consumers ----

  - it: Defaults SERVICE_ENABLE_SIMPLE_AUTH_SECRET to false on the Go services
    templates:
      - api-server-v2/deployment.yaml
    set:
      apiClientSecret:
        enabled: false
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_ENABLE_SIMPLE_AUTH_SECRET')].value
          value: "false"
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')]

  - it: Wires SERVICE_SIMPLE_AUTH_SECRET at the seeded Secret when enabled
    templates:
      - api-server-v2/deployment.yaml
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_ENABLE_SIMPLE_AUTH_SECRET')].value
          value: "true"
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.name
          value: thoras-config-controller
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.key
          value: api-client-secret

  - it: Points SERVICE_SIMPLE_AUTH_SECRET at thoras-helm-values when pinned
    templates:
      - api-server-v2/deployment.yaml
    set:
      apiClientSecret:
        secret: hunter2
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.name
          value: thoras-helm-values
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.key
          value: api-client-secret

  - it: Points SERVICE_SIMPLE_AUTH_SECRET at existingSecret when set
    templates:
      - api-server-v2/deployment.yaml
    set:
      apiClientSecret:
        existingSecret:
          secretName: my-api-client
          secretKey: token
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.name
          value: my-api-client
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.key
          value: token

  # The forecaster reads its config unprefixed (LOGLEVEL, API_BASE_URL, ...),
  # so it gets the same pair without the SERVICE_ prefix.
  - it: Defaults ENABLE_SIMPLE_AUTH_SECRET to false on the forecast worker
    templates:
      - forecast-worker/deployment.yaml
    set:
      apiClientSecret:
        enabled: false
      thorasForecast:
        worker:
          enabled: true
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'ENABLE_SIMPLE_AUTH_SECRET')].value
          value: "false"
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SIMPLE_AUTH_SECRET')]
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_ENABLE_SIMPLE_AUTH_SECRET')]

  - it: Wires unprefixed SIMPLE_AUTH_SECRET into the forecast worker when enabled
    templates:
      - forecast-worker/deployment.yaml
    set:
      thorasForecast:
        worker:
          enabled: true
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'ENABLE_SIMPLE_AUTH_SECRET')].value
          value: "true"
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.name
          value: thoras-config-controller
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.key
          value: api-client-secret
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')]

  - it: Does not forward an Authorization header from the dashboard nginx proxy by default
    templates:
      - dashboard/nginx-config-map.yaml
    set:
      apiClientSecret:
        enabled: false
    asserts:
      - notMatchRegex:
          path: data["nginx.conf.template"]
          pattern: "proxy_set_header Authorization"

  - it: Does not wire SIMPLE_AUTH_SECRET into the dashboard by default
    templates:
      - dashboard/deployment.yaml
    set:
      apiClientSecret:
        enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'SIMPLE_AUTH_SECRET')]
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'NGINX_ENVSUBST_OUTPUT_DIR')].value
          value: /tmp
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].args
          value: ["nginx", "-c", "/tmp/nginx.conf", "-g", "daemon off;"]

  - it: Forwards the shared secret as a Bearer header from the dashboard nginx proxy when enabled
    templates:
      - dashboard/nginx-config-map.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: 'proxy_set_header Authorization "Bearer \$\{SIMPLE_AUTH_SECRET\}";'

  - it: Wires SIMPLE_AUTH_SECRET into the dashboard when enabled
    templates:
      - dashboard/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.name
          value: thoras-config-controller
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.key
          value: api-client-secret
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'NGINX_ENVSUBST_OUTPUT_DIR')].value
          value: /tmp
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].volumeMounts[?(@.name == 'nginx-config')].mountPath
          value: /etc/nginx/templates/nginx.conf.template
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].volumeMounts[?(@.name == 'nginx-config')].subPath
          value: nginx.conf.template

  - it: Points dashboard SIMPLE_AUTH_SECRET at existingSecret when set
    templates:
      - dashboard/deployment.yaml
    set:
      apiClientSecret:
        existingSecret:
          secretName: my-api-client
          secretKey: token
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.name
          value: my-api-client
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.key
          value: token

  # ---- Non-consumers ----
  # These components talk to the Kubernetes API and TimescaleDB directly, never
  # to the Thoras API server. Emitting SERVICE_SIMPLE_AUTH_SECRET here would
  # make config-controller flag them as api-client-secret consumers and drag
  # them into every rotation restart sequence for no runtime benefit.

  - it: Does not receive the api client token on the operator
    templates:
      - operator/deployment.yaml
    asserts:
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')]
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_ENABLE_SIMPLE_AUTH_SECRET')]

  - it: Does not receive the api client token on the operator pre-delete hook
    templates:
      - operator/pre-delete-hook.yaml
    asserts:
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')]
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_ENABLE_SIMPLE_AUTH_SECRET')]

  - it: Does not receive the api client token on the operator post-upgrade hook
    templates:
      - operator/post-upgrade-hook.yaml
    set:
      thorasOperator:
        postUpgradeHook:
          enabled: true
    asserts:
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')]
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_ENABLE_SIMPLE_AUTH_SECRET')]

  - it: Does not receive the api client token on the worker
    templates:
      - worker/deployment.yaml
    asserts:
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')]
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_ENABLE_SIMPLE_AUTH_SECRET')]

  # ---- Deprecated alias: featureFlags.enableSimpleAuthSecret ----
  # The legacy flag continues to work but must not be documented in values.yaml.

  - it: Legacy featureFlags.enableSimpleAuthSecret=false disables via the alias
    templates:
      - config-controller/configmap.yaml
    set:
      featureFlags:
        enableSimpleAuthSecret: false
    asserts:
      - notMatchRegex:
          path: data["config-controller.yaml"]
          pattern: "name: api-client-secret"

  - it: Legacy featureFlags.enableSimpleAuthSecret=true enables via the alias
    templates:
      - config-controller/configmap.yaml
    set:
      featureFlags:
        enableSimpleAuthSecret: true
    asserts:
      - matchRegex:
          path: data["config-controller.yaml"]
          pattern: "name: api-client-secret"

  - it: Conflicting apiClientSecret.enabled=true and legacy=false fails the template
    set:
      apiClientSecret:
        enabled: true
      featureFlags:
        enableSimpleAuthSecret: false
      thorasDashboard:
        enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "apiClientSecret.enabled conflicts with the deprecated featureFlags.enableSimpleAuthSecret; set only one"

  - it: Conflicting apiClientSecret.enabled=false and legacy=true fails the template
    set:
      apiClientSecret:
        enabled: false
      featureFlags:
        enableSimpleAuthSecret: true
      thorasDashboard:
        enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "apiClientSecret.enabled conflicts with the deprecated featureFlags.enableSimpleAuthSecret; set only one"

  - it: Matching values on both fields do not fail the template
    templates:
      - config-controller/configmap.yaml
    set:
      apiClientSecret:
        enabled: true
      featureFlags:
        enableSimpleAuthSecret: true
      thorasDashboard:
        enabled: false
    asserts:
      - matchRegex:
          path: data["config-controller.yaml"]
          pattern: "name: api-client-secret"
