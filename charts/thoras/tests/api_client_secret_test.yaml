suite: ApiClientSecret
tests:
  - it: Does not include api-client-secret in the thoras Secret when disabled
    templates:
      - thoras-shared-secret.yaml
    set:
      apiClientSecret:
        enabled: false
      thorasDashboard:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Includes a generated api-client-secret key in the thoras Secret when enabled
    templates:
      - thoras-shared-secret.yaml
    set:
      thorasDashboard:
        enabled: false
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: thoras-shared
      - exists:
          path: data["api-client-secret"]
      - matchRegex:
          # base64 of a 32-character randAlphaNum
          path: data["api-client-secret"]
          pattern: "^[A-Za-z0-9+/]{43}=$"

  - it: Omits api-client-secret from the thoras Secret when existingSecret is set
    templates:
      - thoras-shared-secret.yaml
    set:
      thorasDashboard:
        enabled: false
      apiClientSecret:
        existingSecret:
          secretName: my-api-client
          secretKey: token
    asserts:
      # dashboard is off + api-client uses existingSecret => nothing to render
      - hasDocuments:
          count: 0

  - it: Fails when both apiClientSecret.secret and existingSecret.secretName are set
    templates:
      - thoras-shared-secret.yaml
    set:
      apiClientSecret:
        secret: hunter2
        existingSecret:
          secretName: my-api-client
    asserts:
      - failedTemplate:
          errorMessage: "apiClientSecret.secret and apiClientSecret.existingSecret.secretName are mutually exclusive"

  # Precedence: values pin wins over lookup + generated. Actual lookup
  # precedence (values > lookup) can't be tested here (helm-unittest cannot
  # seed cluster Secret state); verify manually via `helm upgrade` on a
  # cluster with an existing thoras-shared Secret.
  - it: Uses the pinned apiClientSecret.secret value rather than generating one
    templates:
      - thoras-shared-secret.yaml
    set:
      thorasDashboard:
        enabled: false
      apiClientSecret:
        secret: hunter2
    asserts:
      - equal:
          path: data["api-client-secret"]
          # base64 of "hunter2"
          value: aHVudGVyMg==

  - it: Defaults SERVICE_ENABLE_SIMPLE_AUTH_SECRET to false on the Go services
    templates:
      - api-server-v2/deployment.yaml
    set:
      apiClientSecret:
        enabled: false
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_ENABLE_SIMPLE_AUTH_SECRET')].value
          value: "false"
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')]

  - it: Wires SERVICE_SIMPLE_AUTH_SECRET into the Go services when enabled
    templates:
      - api-server-v2/deployment.yaml
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_ENABLE_SIMPLE_AUTH_SECRET')].value
          value: "true"
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.name
          value: thoras-shared
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.key
          value: api-client-secret

  - it: Points SERVICE_SIMPLE_AUTH_SECRET at existingSecret when set
    templates:
      - api-server-v2/deployment.yaml
    set:
      apiClientSecret:
        existingSecret:
          secretName: my-api-client
          secretKey: token
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.name
          value: my-api-client
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.key
          value: token

  # The forecaster reads its config unprefixed (LOGLEVEL, API_BASE_URL, ...),
  # so it gets the same pair without the SERVICE_ prefix.
  - it: Defaults ENABLE_SIMPLE_AUTH_SECRET to false on the forecast worker
    templates:
      - forecast-worker/deployment.yaml
    set:
      apiClientSecret:
        enabled: false
      thorasForecast:
        worker:
          enabled: true
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'ENABLE_SIMPLE_AUTH_SECRET')].value
          value: "false"
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SIMPLE_AUTH_SECRET')]
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_ENABLE_SIMPLE_AUTH_SECRET')]

  - it: Wires unprefixed SIMPLE_AUTH_SECRET into the forecast worker when enabled
    templates:
      - forecast-worker/deployment.yaml
    set:
      thorasForecast:
        worker:
          enabled: true
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'ENABLE_SIMPLE_AUTH_SECRET')].value
          value: "true"
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.name
          value: thoras-shared
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.key
          value: api-client-secret
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')]

  - it: Does not forward an Authorization header from the dashboard nginx proxy by default
    templates:
      - dashboard/nginx-config-map.yaml
    set:
      apiClientSecret:
        enabled: false
    asserts:
      - notMatchRegex:
          path: data["nginx.conf.template"]
          pattern: "proxy_set_header Authorization"

  - it: Does not wire SIMPLE_AUTH_SECRET into the dashboard by default
    templates:
      - dashboard/deployment.yaml
    set:
      apiClientSecret:
        enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'SIMPLE_AUTH_SECRET')]
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'NGINX_ENVSUBST_OUTPUT_DIR')].value
          value: /tmp
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].args
          value: ["nginx", "-c", "/tmp/nginx.conf", "-g", "daemon off;"]

  - it: Forwards the shared secret as a Bearer header from the dashboard nginx proxy when enabled
    templates:
      - dashboard/nginx-config-map.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: 'proxy_set_header Authorization "Bearer \$\{SIMPLE_AUTH_SECRET\}";'

  - it: Wires SIMPLE_AUTH_SECRET into the dashboard when enabled
    templates:
      - dashboard/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.name
          value: thoras-shared
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.key
          value: api-client-secret
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'NGINX_ENVSUBST_OUTPUT_DIR')].value
          value: /tmp
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].volumeMounts[?(@.name == 'nginx-config')].mountPath
          value: /etc/nginx/templates/nginx.conf.template
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].volumeMounts[?(@.name == 'nginx-config')].subPath
          value: nginx.conf.template

  - it: Points dashboard SIMPLE_AUTH_SECRET at existingSecret when set
    templates:
      - dashboard/deployment.yaml
    set:
      apiClientSecret:
        existingSecret:
          secretName: my-api-client
          secretKey: token
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.name
          value: my-api-client
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.key
          value: token

  # ---- Deprecated alias: featureFlags.enableSimpleAuthSecret ----
  # The legacy flag continues to work but must not be documented in values.yaml.

  - it: Legacy featureFlags.enableSimpleAuthSecret=false disables via the alias
    templates:
      - thoras-shared-secret.yaml
    set:
      featureFlags:
        enableSimpleAuthSecret: false
      thorasDashboard:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Legacy featureFlags.enableSimpleAuthSecret=true enables via the alias
    templates:
      - thoras-shared-secret.yaml
    set:
      featureFlags:
        enableSimpleAuthSecret: true
      thorasDashboard:
        enabled: false
    asserts:
      - exists:
          path: data["api-client-secret"]

  - it: Conflicting apiClientSecret.enabled=true and legacy=false fails the template
    set:
      apiClientSecret:
        enabled: true
      featureFlags:
        enableSimpleAuthSecret: false
      thorasDashboard:
        enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "apiClientSecret.enabled conflicts with the deprecated featureFlags.enableSimpleAuthSecret; set only one"

  - it: Conflicting apiClientSecret.enabled=false and legacy=true fails the template
    set:
      apiClientSecret:
        enabled: false
      featureFlags:
        enableSimpleAuthSecret: true
      thorasDashboard:
        enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "apiClientSecret.enabled conflicts with the deprecated featureFlags.enableSimpleAuthSecret; set only one"

  - it: Matching values on both fields do not fail the template
    templates:
      - thoras-shared-secret.yaml
    set:
      apiClientSecret:
        enabled: true
      featureFlags:
        enableSimpleAuthSecret: true
      thorasDashboard:
        enabled: false
    asserts:
      - exists:
          path: data["api-client-secret"]
