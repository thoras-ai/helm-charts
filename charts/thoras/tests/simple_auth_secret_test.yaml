suite: SimpleAuthSecret
tests:
  - it: Does not render the api-client-secret by default
    templates:
      - api-client-secret.yaml
    set:
      featureFlags:
        enableSimpleAuthSecret: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Renders the api-client-secret with a generated value when enabled
    templates:
      - api-client-secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: api-client-secret
      - exists:
          path: data.secret
      - matchRegex:
          # base64 of a 32-character randAlphaNum
          path: data.secret
          pattern: "^[A-Za-z0-9+/]{43}=$"

  - it: Defaults SERVICE_ENABLE_SIMPLE_AUTH_SECRET to false on the Go services
    templates:
      - api-server-v2/deployment.yaml
    set:
      thorasMonitor:
        unittesting: true
      thorasDashboard:
        unittesting: true
      featureFlags:
        enableSimpleAuthSecret: false
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_ENABLE_SIMPLE_AUTH_SECRET')].value
          value: "false"
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')]

  - it: Wires SERVICE_SIMPLE_AUTH_SECRET into the Go services when enabled
    templates:
      - api-server-v2/deployment.yaml
    set:
      thorasMonitor:
        unittesting: true
      thorasDashboard:
        unittesting: true
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_ENABLE_SIMPLE_AUTH_SECRET')].value
          value: "true"
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.name
          value: api-client-secret
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.key
          value: secret

  # The forecaster reads its config unprefixed (LOGLEVEL, API_BASE_URL, ...),
  # so it gets the same pair without the SERVICE_ prefix.
  - it: Defaults ENABLE_SIMPLE_AUTH_SECRET to false on the forecast worker
    templates:
      - forecast-worker/deployment.yaml
    set:
      featureFlags:
        enableSimpleAuthSecret: false
      thorasForecast:
        worker:
          enabled: true
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'ENABLE_SIMPLE_AUTH_SECRET')].value
          value: "false"
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SIMPLE_AUTH_SECRET')]
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_ENABLE_SIMPLE_AUTH_SECRET')]

  - it: Wires unprefixed SIMPLE_AUTH_SECRET into the forecast worker when enabled
    templates:
      - forecast-worker/deployment.yaml
    set:
      thorasForecast:
        worker:
          enabled: true
    asserts:
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'ENABLE_SIMPLE_AUTH_SECRET')].value
          value: "true"
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.name
          value: api-client-secret
      - equal:
          path: $..spec.containers[*].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.key
          value: secret
      - notExists:
          path: $..spec.containers[*].env[?(@.name == 'SERVICE_SIMPLE_AUTH_SECRET')]

  - it: Does not forward an Authorization header from the dashboard nginx proxy by default
    templates:
      - dashboard/nginx-config-map.yaml
    set:
      featureFlags:
        enableSimpleAuthSecret: false
    asserts:
      - notMatchRegex:
          path: data["nginx.conf.template"]
          pattern: "proxy_set_header Authorization"

  - it: Does not wire SIMPLE_AUTH_SECRET into the dashboard by default
    templates:
      - dashboard/deployment.yaml
    set:
      featureFlags:
        enableSimpleAuthSecret: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'SIMPLE_AUTH_SECRET')]
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'NGINX_ENVSUBST_OUTPUT_DIR')].value
          value: /tmp
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].args
          value: ["nginx", "-c", "/tmp/nginx.conf", "-g", "daemon off;"]

  - it: Forwards the shared secret as a Bearer header from the dashboard nginx proxy when enabled
    templates:
      - dashboard/nginx-config-map.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: 'proxy_set_header Authorization "Bearer \$\{SIMPLE_AUTH_SECRET\}";'

  - it: Wires SIMPLE_AUTH_SECRET into the dashboard when enabled
    templates:
      - dashboard/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.name
          value: api-client-secret
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'SIMPLE_AUTH_SECRET')].valueFrom.secretKeyRef.key
          value: secret
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].env[?(@.name == 'NGINX_ENVSUBST_OUTPUT_DIR')].value
          value: /tmp
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].volumeMounts[?(@.name == 'nginx-config')].mountPath
          value: /etc/nginx/templates/nginx.conf.template
      - equal:
          path: spec.template.spec.containers[?(@.name == 'thoras-dashboard')].volumeMounts[?(@.name == 'nginx-config')].subPath
          value: nginx.conf.template
