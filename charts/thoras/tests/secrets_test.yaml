suite: Secrets
tests:
  - it: Creates the registry secret when the license key is set
    template: registry-secret.yaml
    set:
      thorasLicenseKey: "frou-frou"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: thoras-secret-registry
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false

  - it: Does not create the registry secret when imageCredentials.existingSecret.secretName is set
    template: registry-secret.yaml
    set:
      thorasLicenseKey: "frou-frou"
      imageCredentials:
        existingSecret:
          secretName: "operator-provided"
    asserts:
      - hasDocuments:
          count: 0

  - it: Does not create the registry secret when the license key is empty
    template: registry-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ServiceAccounts point at the operator-provided registry Secret when set
    templates:
      - collector/service-account.yaml
      - operator/service-account.yaml
      - dashboard/service-account.yaml
      - api-server-v2/service-account.yaml
      - forecast-worker/service-account.yaml
      - worker/service-account.yaml
    set:
      thorasLicenseKey: "frou-frou"
      imageCredentials:
        existingSecret:
          secretName: "frou-frou"
    asserts:
      - equal:
          path: imagePullSecrets[0].name
          value: "frou-frou"

  - it: ServiceAccounts point at thoras-secret-registry when only the license key is set
    templates:
      - collector/service-account.yaml
      - operator/service-account.yaml
      - dashboard/service-account.yaml
      - api-server-v2/service-account.yaml
      - forecast-worker/service-account.yaml
      - worker/service-account.yaml
    set:
      thorasLicenseKey: "frou-frou"
    asserts:
      - equal:
          path: imagePullSecrets[0].name
          value: "thoras-secret-registry"

  - it: Points all apps to the operator-provided Slack Secret when configured
    templates:
      - api-server-v2/deployment.yaml
      - operator/deployment.yaml
      - worker/deployment.yaml
    set:
      thorasLicenseKey: "test-license"
      slackWebhook:
        existingSecret:
          secretName: "frou-frou"
          secretKey: "url"
    asserts:
      - equal:
          path: $..spec.containers[0].env[?(@.name =~ /SLACK_WEBHOOK_URL$/)].valueFrom.secretKeyRef.name
          value: "frou-frou"
      - equal:
          path: $..spec.containers[0].env[?(@.name =~ /SLACK_WEBHOOK_URL/)].valueFrom.secretKeyRef.key
          value: "url"

  - it: Points all apps to the unified credentials Secret when a Slack key is set without an existingSecret
    templates:
      - api-server-v2/deployment.yaml
      - operator/deployment.yaml
      - worker/deployment.yaml
    set:
      thorasLicenseKey: "test-license"
      slackWebhook:
        url: "https://slack.example.com/webhook"
        existingSecret:
          secretKey: "slack-webhook-url"
    asserts:
      - equal:
          path: $..spec.containers[-1].env[?(@.name =~ /SLACK_WEBHOOK_URL$/)].valueFrom.secretKeyRef.name
          value: "thoras-credentials"
      - equal:
          path: $..spec.containers[-1].env[?(@.name =~ /SLACK_WEBHOOK_URL$/)].valueFrom.secretKeyRef.key
          value: "slack-webhook-url"

  - it: Slack env vars are absent when the integration is disabled (empty secretKey)
    templates:
      - api-server-v2/deployment.yaml
      - operator/deployment.yaml
      - worker/deployment.yaml
    set:
      thorasLicenseKey: "test-license"
    asserts:
      - notExists:
          path: $..spec.containers[*].env[?(@.name =~ /SLACK_WEBHOOK_URL$/)]

  - it: Should set the SERVICE_CLUSTER_NAME environment variables
    templates:
      - api-server-v2/deployment.yaml
      - worker/deployment.yaml
    set:
      thorasLicenseKey: "test-license"
      cluster:
        name: "test_dev"
    asserts:
      - equal:
          path: $..spec.containers[-1].env[?(@.name =~ /SERVICE_CLUSTER_NAME$/)].value
          value: "test_dev"
