suite: Reuse-values upgrade smoke test
# helm upgrade --reuse-values renders the new chart against the previous
# release's values without merging new chart defaults, so traversing a values
# key newer than that release panics at render for every customer. When adding
# a new values block, add a case here with the block nulled out.
templates:
  - "**/*.yaml"
tests:
  - it: All templates render when the certManager block is missing from stored values
    set:
      thorasOperator.webhookCertGen.certManager: null
    asserts:
      - notFailedTemplate: {}

  - it: All templates render when certManager.ca is missing from stored values
    set:
      thorasOperator.webhookCertGen.certManager.enabled: true
      thorasOperator.webhookCertGen.certManager.ca: null
    asserts:
      - notFailedTemplate: {}

  - it: All templates render when enablePodLogStreaming is missing from stored values
    set:
      featureFlags.enablePodLogStreaming: null
    asserts:
      - notFailedTemplate: {}

  - it: All templates render when enableAutonomousReadiness is missing from stored values
    set:
      featureFlags.enableAutonomousReadiness: null
    asserts:
      - notFailedTemplate: {}

  - it: All templates render when enableIdleSpend is missing from stored values
    set:
      featureFlags.enableIdleSpend: null
    asserts:
      - notFailedTemplate: {}

  - it: All templates render when enableAutoscalerEventCollector is missing from stored values
    set:
      featureFlags.enableAutoscalerEventCollector: null
    asserts:
      - notFailedTemplate: {}

  - it: All templates render when the timescale tls block is missing from stored values
    set:
      metricsCollector.timescale.tls: null
    asserts:
      - notFailedTemplate: {}

  - it: All templates render when the postUpgradeHook block is missing from stored values
    set:
      thorasOperator.postUpgradeHook: null
    asserts:
      - notFailedTemplate: {}

  - it: All templates render when the thorasMcp block is missing from stored values
    set:
      thorasMcp: null
    asserts:
      - notFailedTemplate: {}

  - it: All templates render when the Cost Explorer role values are missing from stored values
    set:
      thorasWorker.costExplorerRoleArn: null
      thorasWorker.costExplorerRoleExternalId: null
    asserts:
      - notFailedTemplate: {}
