suite: Worker Service Account
templates:
  - worker/service-account.yaml
tests:
  - it: Should have no annotations by default
    asserts:
      - notExists:
          path: metadata.annotations
  - it: Should set annotations when specified
    set:
      thorasWorker:
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/thoras-cost-explorer
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/thoras-cost-explorer
