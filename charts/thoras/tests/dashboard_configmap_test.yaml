suite: Dashboard
templates:
  - dashboard/nginx-config-map.yaml
chart:
  version: "4.36.0"
set:
  thorasVersion: "1.2.3"
  cluster:
    name: phantom-assassin
tests:
  - it: Should default to v2 port
    set:
    asserts:
      - matchSnapshot:
          path: data["nginx.conf.template"]
  - it: should set extras in config.json
    set:
      thorasDashboard:
        extras:
          cluster_name: phantom-assassin
          foo: bar
          feature: true
    asserts:
      - matchSnapshot:
          path: data["nginx.conf.template"]
  - it: Should render the nginx config under the nginx.conf.template key
    asserts:
      - exists:
          path: data["nginx.conf.template"]
      - notExists:
          path: data["nginx.conf"]

  # Under auth, nginx must not bind containerPort - the sidecar owns it.
  # [::1] is intentionally omitted: unused (oauth2-proxy dials 127.0.0.1)
  # and fails on IPv4-only pods with EADDRNOTAVAIL.
  - it: Binds nginx to loopback on the internal port when auth is enabled
    asserts:
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: 'listen +127\.0\.0\.1:8181;'
      - notMatchRegex:
          path: data["nginx.conf.template"]
          pattern: '\[::1\]'
      - notMatchRegex:
          path: data["nginx.conf.template"]
          pattern: '(?m)^ *listen +8080;'
      - notMatchRegex:
          path: data["nginx.conf.template"]
          pattern: '(?m)^ *listen +\[::\]:8080 ipv6only=on;'
      - notMatchRegex:
          path: data["nginx.conf.template"]
          pattern: '127\.0\.0\.1:8080'

  # Auth-off: nginx listens on the pod IP; the loopback port must not leak.
  - it: Binds nginx to all interfaces on containerPort when auth is disabled
    set:
      thorasDashboard:
        auth:
          enabled: false
    asserts:
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: '(?m)^ *listen +8080;'
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: '(?m)^ *listen +\[::\]:8080 ipv6only=on;'
      - notMatchRegex:
          path: data["nginx.conf.template"]
          pattern: '127\.0\.0\.1'
      - notMatchRegex:
          path: data["nginx.conf.template"]
          pattern: '8181'

  - it: Forwards oauth2-proxy identity headers to the API when auth is enabled
    asserts:
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: 'proxy_set_header X-Forwarded-Email \$http_x_forwarded_email;'
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: 'proxy_set_header X-Forwarded-User \$http_x_forwarded_user;'

  - it: Strips identity headers when auth is disabled
    set:
      thorasDashboard:
        auth:
          enabled: false
    asserts:
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: 'proxy_set_header X-Forwarded-Email "";'
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: 'proxy_set_header X-Forwarded-User "";'
      - notMatchRegex:
          path: data["nginx.conf.template"]
          pattern: '\$http_x_forwarded_email'

  - it: read_only true injects disable_onboarding and disables scaling_pause and scale mode in config.json
    set:
      thorasDashboard:
        read_only: true
    asserts:
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: '"disable_onboarding":true'
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: '"enable_scaling_pause":false'
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: '"enableUpdateScaleModeApi": false'

  - it: read_only true overrides explicit extras values
    set:
      thorasDashboard:
        read_only: true
        extras:
          enable_scaling_pause: true
    asserts:
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: '"enable_scaling_pause":false'
      - matchRegex:
          path: data["nginx.conf.template"]
          pattern: '"disable_onboarding":true'

  - it: read_only false does not inject onboarding override
    set:
      thorasDashboard:
        read_only: false
    asserts:
      - notMatchRegex:
          path: data["nginx.conf.template"]
          pattern: '"disable_onboarding"'
