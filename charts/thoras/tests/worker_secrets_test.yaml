suite: WorkerSecrets
tests:
  - it: Points the worker to the operator-provided cloud-sync Secret when configured
    templates:
      - worker/deployment.yaml
    set:
      thorasLicenseKey: "test-license"
      cloudSync:
        baseUrl: "https://console.thoras.ai"
        clusterKeyID: "id123"
        existingSecret:
          secretName: "frou-frou"
          secretKey: "url"
    asserts:
      - equal:
          path: $..spec.containers[?(@.name == 'thoras-worker')].env[?(@.name == 'SERVICE_CLOUD_SYNC_CLUSTER_KEY')].valueFrom.secretKeyRef.name
          value: "frou-frou"
      - equal:
          path: $..spec.containers[?(@.name == 'thoras-worker')].env[?(@.name == 'SERVICE_CLOUD_SYNC_CLUSTER_KEY')].valueFrom.secretKeyRef.key
          value: "url"

  - it: Points the worker to the unified credentials Secret when the cloud-sync key is set without an existingSecret
    templates:
      - worker/deployment.yaml
    set:
      thorasLicenseKey: "test-license"
      cloudSync:
        baseUrl: "https://console.thoras.ai"
        clusterKeyID: "id123"
        clusterKey: "the-key"
        existingSecret:
          secretKey: "cloud-sync-cluster-key"
    asserts:
      - equal:
          path: $..spec.containers[?(@.name == 'thoras-worker')].env[?(@.name == 'SERVICE_CLOUD_SYNC_CLUSTER_KEY')].valueFrom.secretKeyRef.name
          value: "thoras-credentials"
      - equal:
          path: $..spec.containers[?(@.name == 'thoras-worker')].env[?(@.name == 'SERVICE_CLOUD_SYNC_CLUSTER_KEY')].valueFrom.secretKeyRef.key
          value: "cloud-sync-cluster-key"

  - it: Omits SERVICE_CLOUD_SYNC_CLUSTER_KEY when cloud-sync is disabled (empty secretKey)
    templates:
      - worker/deployment.yaml
    set:
      thorasLicenseKey: "test-license"
      cloudSync:
        baseUrl: "https://console.thoras.ai"
        clusterKeyID: "id123"
    asserts:
      - notExists:
          path: $..spec.containers[?(@.name == 'thoras-worker')].env[?(@.name == 'SERVICE_CLOUD_SYNC_CLUSTER_KEY')]
      - equal:
          path: $..spec.containers[?(@.name == 'thoras-worker')].env[?(@.name == 'SERVICE_ENABLE_CLOUD_SYNC_WORKER')].value
          value: "false"
