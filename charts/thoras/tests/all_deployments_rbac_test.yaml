suite: RBAC services
templates:
  - "*/rbac.yaml"
set:
  thorasVersion: TEST
  imageCredentials:
    secretRef: test-secret-registry
  thorasApiServerV2:
    rbac:
      create: true
  rbac:
    namespaces:
      - thoras
tests:
  - it: Default matches snapshot
    chart:
      version: "4.7.0"
    asserts:
      - matchSnapshot: {}
  - it: Read rules never combine a wildcard apiGroup with a wildcard resource
    chart:
      version: "4.7.0"
    asserts:
      - not: true
        documentSelector: {path: kind, value: ClusterRole, matchMany: true, skipEmptyTemplates: true}
        contains:
          path: rules
          any: true
          content: {apiGroups: ["*"], resources: ["*"]}
      - not: true
        documentSelector: {path: kind, value: Role, matchMany: true, skipEmptyTemplates: true}
        contains:
          path: rules
          any: true
          content: {apiGroups: ["*"], resources: ["*"]}
  - it: Karpenter NodePools and NodeClaims are read through the cluster-scoped ClusterRoles when namespaced
    templates: &karpenterReaders
      - api-server-v2/rbac.yaml
      - operator/rbac.yaml
      - worker/rbac.yaml
    documentSelector: &karpenterRule {path: "rules[?(@.apiGroups[0] == 'karpenter.sh')]", matchMany: true}
    asserts: &karpenterAsserts
      - equal:
          path: kind
          value: ClusterRole
      - matchRegex:
          path: metadata.name
          pattern: -cluster-scoped$
      - contains:
          path: rules
          content: {apiGroups: [karpenter.sh], resources: [nodepools, nodeclaims], verbs: [get, list, watch]}
  - it: Karpenter NodePools and NodeClaims are read through the cluster-scoped ClusterRoles cluster-wide
    templates: *karpenterReaders
    set:
      rbac.namespaces: null
    documentSelector: *karpenterRule
    asserts: *karpenterAsserts
