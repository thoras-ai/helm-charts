suite: RBAC services
templates:
  - "*/rbac.yaml"
set:
  thorasVersion: TEST
  imageCredentials:
    secretRef: test-secret-registry
  thorasApiServerV2:
    rbac:
      create: true
  rbac:
    namespaces:
      - thoras
tests:
  - it: Default matches snapshot
    chart:
      version: "4.7.0"
    asserts:
      - matchSnapshot: {}
  - it: Read rules never combine a wildcard apiGroup with a wildcard resource
    chart:
      version: "4.7.0"
    asserts:
      - not: true
        documentSelector:
          path: rules
          matchMany: true
          skipEmptyTemplates: true
        contains:
          path: rules
          any: true
          content:
            apiGroups: ["*"]
            resources: ["*"]
