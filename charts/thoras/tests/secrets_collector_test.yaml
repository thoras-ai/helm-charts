suite: SecretsCollector
tests:
  - it: Points the blob-service to the operator-provided Slack Secret when configured
    templates:
      - collector/deployment.yaml
    set:
      thorasLicenseKey: "test-license"
      slackWebhook:
        existingSecret:
          secretName: "frou-frou"
          secretKey: "url"
    asserts:
      - equal:
          path: $..spec.containers[?(@.name == 'thoras-blob-api')].env[?(@.name == 'SERVICE_SLACK_WEBHOOK_URL')].valueFrom.secretKeyRef.name
          value: "frou-frou"
      - equal:
          path: $..spec.containers[?(@.name == 'thoras-blob-api')].env[?(@.name == 'SERVICE_SLACK_WEBHOOK_URL')].valueFrom.secretKeyRef.key
          value: "url"

  - it: Points the blob-service to the unified credentials Secret when the Slack key is set without an existingSecret
    templates:
      - collector/deployment.yaml
    set:
      thorasLicenseKey: "test-license"
      slackWebhook:
        url: "https://slack.example.com/webhook"
        existingSecret:
          secretKey: "slack-webhook-url"
    asserts:
      - equal:
          path: $..spec.containers[?(@.name == 'thoras-blob-api')].env[?(@.name == 'SERVICE_SLACK_WEBHOOK_URL')].valueFrom.secretKeyRef.name
          value: "thoras-credentials"
      - equal:
          path: $..spec.containers[?(@.name == 'thoras-blob-api')].env[?(@.name == 'SERVICE_SLACK_WEBHOOK_URL')].valueFrom.secretKeyRef.key
          value: "slack-webhook-url"

  - it: Omits SERVICE_SLACK_WEBHOOK_URL when Slack is disabled (empty secretKey)
    templates:
      - collector/deployment.yaml
    set:
      thorasLicenseKey: "test-license"
    asserts:
      - notExists:
          path: $..spec.containers[?(@.name == 'thoras-blob-api')].env[?(@.name == 'SERVICE_SLACK_WEBHOOK_URL')]
