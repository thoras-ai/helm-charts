suite: Network Policy
# networkPolicy.enabled defaults to true as of chart 6.0.0, so the suite only
# pins the flavor. Tests that need the off state set enabled: false explicitly.
set:
  networkPolicy:
    flavor: kubernetes
tests:
  # --- Rendering guards ---

  # A default install must carry all eight policies. Without them any pod in
  # the cluster can reach the API server and TimescaleDB directly.
  - it: Renders every policy with default values
    templates:
      - api-server-v2/network-policy.yaml
      - collector/network-policy.yaml
      - config-controller/network-policy.yaml
      - dashboard/network-policy.yaml
      - forecast-worker/network-policy.yaml
      - operator/network-policy.yaml
      - operator/webhooks-certgen-network-policy.yaml
      - worker/network-policy.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy

  - it: Does not render when networkPolicy is disabled
    set:
      networkPolicy:
        enabled: false
    templates:
      - api-server-v2/network-policy.yaml
      - collector/network-policy.yaml
      - forecast-worker/network-policy.yaml
      - operator/network-policy.yaml
      - operator/webhooks-certgen-network-policy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: Does not render dashboard policy when dashboard is disabled
    template: dashboard/network-policy.yaml
    set:
      thorasDashboard:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Does not render worker policy when worker is disabled
    template: worker/network-policy.yaml
    set:
      thorasWorker:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # --- Kubernetes flavor ---

  - it: Renders NetworkPolicy kind for kubernetes flavor
    templates:
      - api-server-v2/network-policy.yaml
      - collector/network-policy.yaml
      - forecast-worker/network-policy.yaml
      - operator/network-policy.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: apiVersion
          value: networking.k8s.io/v1

  - it: Operator kubernetes policy targets the correct pod selector
    template: operator/network-policy.yaml
    asserts:
      - equal:
          path: spec.podSelector.matchLabels.app
          value: thoras-operator

  - it: Operator kubernetes policy allows webhook ingress on port 9443
    template: operator/network-policy.yaml
    asserts:
      - contains:
          path: spec.ingress
          content:
            ports:
            - port: 9443
              protocol: TCP

  - it: Operator kubernetes policy allows API server egress on the default ports
    template: operator/network-policy.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
            - port: 443
              protocol: TCP
            - port: 6443
              protocol: TCP
            - port: 8443
              protocol: TCP

  - it: All kubernetes policies allow API server egress on custom ports
    templates:
      - api-server-v2/network-policy.yaml
      - operator/network-policy.yaml
      - operator/webhooks-certgen-network-policy.yaml
      - worker/network-policy.yaml
    set:
      networkPolicy:
        apiServerPorts:
        - 443
        - 6443
        - 8443
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
            - port: 443
              protocol: TCP
            - port: 6443
              protocol: TCP
            - port: 8443
              protocol: TCP

  # An empty list must drop the rule entirely. Rendering a rule with no ports
  # would allow egress to every port instead of none.
  - it: Empty apiServerPorts omits the API server egress rule
    templates:
      - api-server-v2/network-policy.yaml
      - operator/network-policy.yaml
      - operator/webhooks-certgen-network-policy.yaml
      - worker/network-policy.yaml
    set:
      networkPolicy:
        apiServerPorts: []
    asserts:
      - notContains:
          path: spec.egress
          content:
            ports:
            - port: 443
              protocol: TCP
            - port: 6443
              protocol: TCP
      - notContains:
          path: spec.egress
          content:
            ports: null

  - it: Cilium policies target the API server entity regardless of apiServerPorts
    templates:
      - api-server-v2/network-policy.yaml
      - operator/network-policy.yaml
      - operator/webhooks-certgen-network-policy.yaml
      - worker/network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
        apiServerPorts: []
    asserts:
      - contains:
          path: spec.egress
          content:
            toEntities:
            - kube-apiserver

  - it: Dashboard kubernetes policy allows external ingress on containerPort when auth is disabled
    template: dashboard/network-policy.yaml
    set:
      thorasDashboard:
        auth:
          enabled: false
    asserts:
      - contains:
          path: spec.ingress
          content:
            ports:
            - port: 8080
              protocol: TCP

  - it: Dashboard kubernetes policy follows containerPort overrides
    template: dashboard/network-policy.yaml
    set:
      thorasDashboard:
        containerPort: 9090
    asserts:
      - contains:
          path: spec.ingress
          content:
            ports:
            - port: 9090
              protocol: TCP
      - notContains:
          path: spec.ingress
          content:
            ports:
            - port: 8080
              protocol: TCP

  - it: Dashboard kubernetes policy opens external HTTPS egress under mode oidc for IdP reachability
    template: dashboard/network-policy.yaml
    set:
      thorasDashboard:
        auth:
          mode: oidc
          oidc:
            issuerURL: https://idp.example.com
            redirectURL: https://thoras.example.com/oauth2/callback
            existingSecret:
              secretName: oauth2-proxy-secrets
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
            - ipBlock:
                cidr: 0.0.0.0/0
            ports:
            - port: 443
              protocol: TCP

  - it: Dashboard kubernetes policy does not open external HTTPS egress under mode htpasswd
    template: dashboard/network-policy.yaml
    asserts:
      - notContains:
          path: spec.egress
          content:
            to:
            - ipBlock:
                cidr: 0.0.0.0/0
            ports:
            - port: 443
              protocol: TCP

  - it: Dashboard kubernetes policy does not open external HTTPS egress when auth is disabled
    template: dashboard/network-policy.yaml
    set:
      thorasDashboard:
        auth:
          enabled: false
    asserts:
      - notContains:
          path: spec.egress
          content:
            to:
            - ipBlock:
                cidr: 0.0.0.0/0
            ports:
            - port: 443
              protocol: TCP

  - it: All kubernetes policies allow DNS egress via kube-dns
    templates:
      - api-server-v2/network-policy.yaml
      - collector/network-policy.yaml
      - forecast-worker/network-policy.yaml
      - operator/network-policy.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
            ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP

  # --- Cilium flavor ---

  - it: Renders CiliumNetworkPolicy kind for cilium flavor
    templates:
      - api-server-v2/network-policy.yaml
      - collector/network-policy.yaml
      - forecast-worker/network-policy.yaml
      - operator/network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - equal:
          path: apiVersion
          value: cilium.io/v2

  - it: Operator cilium policy allows kube-apiserver ingress for webhook callbacks
    template: operator/network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
    asserts:
      - contains:
          path: spec.ingress
          content:
            fromEntities:
            - kube-apiserver

  - it: Operator cilium policy allows kube-apiserver egress
    template: operator/network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
    asserts:
      - contains:
          path: spec.egress
          content:
            toEntities:
            - kube-apiserver

  - it: All cilium policies allow DNS egress via kube-dns endpoint
    templates:
      - api-server-v2/network-policy.yaml
      - collector/network-policy.yaml
      - forecast-worker/network-policy.yaml
      - operator/network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
    asserts:
      - contains:
          path: spec.egress
          content:
            toEndpoints:
            - matchLabels:
                k8s:k8s-app: kube-dns
                k8s:io.kubernetes.pod.namespace: kube-system
            toPorts:
            - ports:
              - port: "53"
                protocol: ANY
              rules:
                dns:
                - matchPattern: "*"

  # --- extraEgressRules ---

  - it: Injects extraEgressRules into the kubernetes egress list
    template: api-server-v2/network-policy.yaml
    set:
      thorasApiServerV2:
        extraEgressRules:
          - ports:
            - port: 9200
              protocol: TCP
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
            - port: 9200
              protocol: TCP

  - it: Injects extraEgressRules into the cilium egress list
    template: collector/network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
      metricsCollector:
        extraEgressRules:
          - toFQDNs:
            - matchName: "my-database.example.com"
    asserts:
      - contains:
          path: spec.egress
          content:
            toFQDNs:
            - matchName: "my-database.example.com"

  # --- extraIngressRules ---

  - it: Injects extraIngressRules into the kubernetes ingress list
    template: api-server-v2/network-policy.yaml
    set:
      thorasApiServerV2:
        extraIngressRules:
          - ports:
            - port: 8443
              protocol: TCP
    asserts:
      - contains:
          path: spec.ingress
          content:
            ports:
            - port: 8443
              protocol: TCP

  - it: Injects extraIngressRules into the cilium ingress list
    template: collector/network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
      metricsCollector:
        extraIngressRules:
          - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: monitoring
    asserts:
      - contains:
          path: spec.ingress
          content:
            fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: monitoring

  # --- Certgen network policy ---

  - it: Certgen kubernetes policy targets the webhook-certgen component selector
    template: operator/webhooks-certgen-network-policy.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: webhook-certgen

  - it: Certgen kubernetes policy allows API server egress on the default ports
    template: operator/webhooks-certgen-network-policy.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
            - port: 443
              protocol: TCP
            - port: 6443
              protocol: TCP
            - port: 8443
              protocol: TCP

  - it: Certgen kubernetes policy allows DNS egress via kube-dns
    template: operator/webhooks-certgen-network-policy.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
            ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP

  - it: Certgen cilium policy targets the webhook-certgen component selector
    template: operator/webhooks-certgen-network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - equal:
          path: spec.endpointSelector.matchLabels["app.kubernetes.io/component"]
          value: webhook-certgen

  - it: Certgen cilium policy allows kube-apiserver egress
    template: operator/webhooks-certgen-network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
    asserts:
      - contains:
          path: spec.egress
          content:
            toEntities:
            - kube-apiserver

  - it: Certgen cilium policy allows DNS egress via kube-dns endpoint
    template: operator/webhooks-certgen-network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
    asserts:
      - contains:
          path: spec.egress
          content:
            toEndpoints:
            - matchLabels:
                k8s:k8s-app: kube-dns
                k8s:io.kubernetes.pod.namespace: kube-system
            toPorts:
            - ports:
              - port: "53"
                protocol: ANY
              rules:
                dns:
                - matchPattern: "*"

  # --- DNS fallback (networkPolicy.allowDnsToAnyDestination) ---

  # NodeLocal DNSCache answers on a link-local address owned by the node, which
  # the kube-dns pod selector does not match.
  - it: All kubernetes policies allow DNS to any destination by default
    templates:
      - api-server-v2/network-policy.yaml
      - collector/network-policy.yaml
      - config-controller/network-policy.yaml
      - dashboard/network-policy.yaml
      - forecast-worker/network-policy.yaml
      - operator/network-policy.yaml
      - operator/webhooks-certgen-network-policy.yaml
      - worker/network-policy.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP

  - it: allowDnsToAnyDestination false drops the kubernetes DNS fallback but keeps kube-dns
    templates:
      - api-server-v2/network-policy.yaml
      - operator/webhooks-certgen-network-policy.yaml
    set:
      networkPolicy:
        allowDnsToAnyDestination: false
    asserts:
      - notContains:
          path: spec.egress
          content:
            ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP
      - contains:
          path: spec.egress
          content:
            to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
            ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP

  - it: All cilium policies allow DNS to the node entities by default
    templates:
      - api-server-v2/network-policy.yaml
      - collector/network-policy.yaml
      - operator/network-policy.yaml
      - worker/network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
    asserts:
      - contains:
          path: spec.egress
          content:
            toEntities:
            - host
            - remote-node
            toPorts:
            - ports:
              - port: "53"
                protocol: ANY

  - it: allowDnsToAnyDestination false drops the cilium DNS fallback
    template: api-server-v2/network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
        allowDnsToAnyDestination: false
    asserts:
      - notContains:
          path: spec.egress
          content:
            toEntities:
            - host
            - remote-node
            toPorts:
            - ports:
              - port: "53"
                protocol: ANY

  # --- Metrics scraping ingress (networkPolicy.allowMetricsScraping) ---

  - it: Components with a dedicated metrics port accept scrapes from any namespace
    templates:
      - config-controller/network-policy.yaml
      - forecast-worker/network-policy.yaml
      - operator/network-policy.yaml
      - worker/network-policy.yaml
    asserts:
      - contains:
          path: spec.ingress
          any: true
          content:
            from:
            - namespaceSelector: {}

  - it: Worker metrics ingress follows the configured prometheus port
    template: worker/network-policy.yaml
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
            - namespaceSelector: {}
            ports:
            - port: 9102
              protocol: TCP

  # The API server's metrics share its API port, so a cross-namespace scrape
  # rule would expose the API. Scraping it requires an explicit extraIngressRule.
  - it: API server policy does not open cross-namespace ingress for metrics
    template: api-server-v2/network-policy.yaml
    asserts:
      - notContains:
          path: spec.ingress
          any: true
          content:
            from:
            - namespaceSelector: {}

  - it: allowMetricsScraping false drops the cross-namespace scrape ingress
    templates:
      - config-controller/network-policy.yaml
      - forecast-worker/network-policy.yaml
      - operator/network-policy.yaml
      - worker/network-policy.yaml
    set:
      networkPolicy:
        allowMetricsScraping: false
    asserts:
      - notContains:
          path: spec.ingress
          any: true
          content:
            from:
            - namespaceSelector: {}

  - it: Cilium policies accept scrapes from the cluster entity
    template: worker/network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
    asserts:
      - contains:
          path: spec.ingress
          content:
            fromEntities:
            - cluster
            toPorts:
            - ports:
              - port: "9102"
                protocol: TCP

  # --- External database egress ---

  - it: No external database egress when the bundled TimescaleDB is used
    templates:
      - api-server-v2/network-policy.yaml
      - collector/network-policy.yaml
      - operator/network-policy.yaml
      - worker/network-policy.yaml
    asserts:
      - notContains:
          path: spec.egress
          content:
            ports:
            - port: 5432
              protocol: TCP

  - it: DSN-holding components get external database egress when externalTimescale is set
    templates:
      - api-server-v2/network-policy.yaml
      - collector/network-policy.yaml
      - operator/network-policy.yaml
      - worker/network-policy.yaml
    set:
      externalTimescale:
        dsn: "postgres://u:p@db.example.com:5432/tsdb"
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
            - port: 5432
              protocol: TCP

  - it: External database egress follows externalDatabasePorts
    template: worker/network-policy.yaml
    set:
      externalTimescale:
        dsn: "postgres://u:p@db.example.com:6432/tsdb"
      networkPolicy:
        externalDatabasePorts:
        - 6432
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
            - port: 6432
              protocol: TCP

  - it: Cilium external database egress targets the world entity
    template: worker/network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
      externalTimescale:
        dsn: "postgres://u:p@db.example.com:5432/tsdb"
    asserts:
      - contains:
          path: spec.egress
          content:
            toEntities:
            - world
            toPorts:
            - ports:
              - port: "5432"
                protocol: TCP

  # --- API server egress scoping (networkPolicy.apiServerCIDRs) ---

  # Without CIDRs the rule is ports-only, which standard NetworkPolicy evaluates
  # as any destination on those ports.
  - it: apiServerCIDRs scopes the API server egress rule to an ipBlock
    templates:
      - api-server-v2/network-policy.yaml
      - operator/webhooks-certgen-network-policy.yaml
    set:
      networkPolicy:
        apiServerCIDRs:
        - 10.0.0.0/16
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
            - ipBlock:
                cidr: 10.0.0.0/16
            ports:
            - port: 443
              protocol: TCP
            - port: 6443
              protocol: TCP
            - port: 8443
              protocol: TCP
      - notContains:
          path: spec.egress
          content:
            ports:
            - port: 443
              protocol: TCP
            - port: 6443
              protocol: TCP
            - port: 8443
              protocol: TCP

  - it: Cilium flavor ignores apiServerCIDRs
    template: api-server-v2/network-policy.yaml
    set:
      networkPolicy:
        flavor: cilium
        apiServerCIDRs:
        - 10.0.0.0/16
    asserts:
      - contains:
          path: spec.egress
          content:
            toEntities:
            - kube-apiserver
