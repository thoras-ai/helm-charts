suite: Network Policy
set:
  networkPolicy:
    enabled: true
tests:
  # --- Rendering guards ---

  - it: Does not render when networkPolicy is disabled
    set:
      networkPolicy:
        enabled: false
    templates:
      - api-server-v2/network-policy.yaml
      - collector/network-policy.yaml
      - forecast-worker/network-policy.yaml
      - operator/network-policy.yaml
      - operator/webhooks-certgen-network-policy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: Does not render dashboard policy when dashboard is disabled
    template: dashboard/network-policy.yaml
    set:
      thorasDashboard:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Does not render worker policy when worker is disabled
    template: worker/network-policy.yaml
    set:
      thorasWorker:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # --- Policy shape ---

  - it: Renders CiliumNetworkPolicy kind
    templates:
      - api-server-v2/network-policy.yaml
      - collector/network-policy.yaml
      - forecast-worker/network-policy.yaml
      - operator/network-policy.yaml
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - equal:
          path: apiVersion
          value: cilium.io/v2

  - it: Operator policy targets the correct endpoint selector
    template: operator/network-policy.yaml
    asserts:
      - equal:
          path: spec.endpointSelector.matchLabels.app
          value: thoras-operator

  - it: Operator policy allows kube-apiserver ingress for webhook callbacks
    template: operator/network-policy.yaml
    asserts:
      - contains:
          path: spec.ingress
          content:
            fromEntities:
            - kube-apiserver

  - it: Policies that talk to the API server target the kube-apiserver entity
    templates:
      - api-server-v2/network-policy.yaml
      - operator/network-policy.yaml
      - operator/webhooks-certgen-network-policy.yaml
      - worker/network-policy.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            toEntities:
            - kube-apiserver

  - it: Dashboard policy allows external ingress on containerPort when auth is disabled
    template: dashboard/network-policy.yaml
    set:
      thorasDashboard:
        auth:
          enabled: false
    asserts:
      - contains:
          path: spec.ingress
          content:
            fromEntities:
            - all
            toPorts:
            - ports:
              - port: "8080"
                protocol: TCP

  - it: All policies allow DNS egress via kube-dns endpoint
    templates:
      - api-server-v2/network-policy.yaml
      - collector/network-policy.yaml
      - forecast-worker/network-policy.yaml
      - operator/network-policy.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            toEndpoints:
            - matchLabels:
                k8s:k8s-app: kube-dns
                k8s:io.kubernetes.pod.namespace: kube-system
            toPorts:
            - ports:
              - port: "53"
                protocol: ANY
              rules:
                dns:
                - matchPattern: "*"

  # --- extraEgressRules ---

  - it: Injects extraEgressRules into the egress list
    template: collector/network-policy.yaml
    set:
      metricsCollector:
        extraEgressRules:
          - toFQDNs:
            - matchName: "my-database.example.com"
    asserts:
      - contains:
          path: spec.egress
          content:
            toFQDNs:
            - matchName: "my-database.example.com"

  # --- extraIngressRules ---

  - it: Injects extraIngressRules into the ingress list
    template: collector/network-policy.yaml
    set:
      metricsCollector:
        extraIngressRules:
          - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: monitoring
    asserts:
      - contains:
          path: spec.ingress
          content:
            fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: monitoring

  # --- Certgen network policy ---

  - it: Certgen policy targets the webhook-certgen component selector
    template: operator/webhooks-certgen-network-policy.yaml
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - equal:
          path: spec.endpointSelector.matchLabels["app.kubernetes.io/component"]
          value: webhook-certgen

  - it: Certgen policy allows DNS egress via kube-dns endpoint
    template: operator/webhooks-certgen-network-policy.yaml
    asserts:
      - contains:
          path: spec.egress
          content:
            toEndpoints:
            - matchLabels:
                k8s:k8s-app: kube-dns
                k8s:io.kubernetes.pod.namespace: kube-system
            toPorts:
            - ports:
              - port: "53"
                protocol: ANY
              rules:
                dns:
                - matchPattern: "*"
