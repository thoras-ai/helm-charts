---
thorasVersion: "4.119.0"
cluster:
  name: ""

imageCredentials:
  registry: "us-east4-docker.pkg.dev/thoras-registry/platform"
  username: "_json_key_base64"

  # Set the license key directly as a variable (or alternatively
  # use imageCredentials.secretRef to reference an existing secret
  password: ""

  # Reference a pre-existing secret in the Thoras namespace
  secretRef: ""
  imagePullSecretInDeployment: false

resourceQuota:
  enabled: false
  pods: 200
  cronjobs: 200
  jobs: 200

networkPolicy:
  enabled: false
  # flavor: "kubernetes" uses standard NetworkPolicy (networking.k8s.io/v1)
  # flavor: "cilium" uses CiliumNetworkPolicy (cilium.io/v2)
  flavor: kubernetes
  # -- Ports the Kubernetes API server is reachable on, used by the "kubernetes"
  # flavor to allow egress from components that talk to the API.
  # NetworkPolicy is evaluated after kube-proxy translates the service address
  # (10.96.0.1:443) to the real endpoint, so this must list the port the API
  # server actually listens on -- not the service port. Check with:
  #   kubectl get endpoints kubernetes -n default
  # Clusters that front the API on a non-standard port (minikube uses 8443)
  # must add it here or components will fail to reach the API.
  # Ignored by the "cilium" flavor, which resolves the API server via
  # `toEntities: [kube-apiserver]` and needs no port list.
  apiServerPorts:
  - 443
  - 6443

imagePullPolicy: "IfNotPresent"

logLevel: info

# -- Additional environment variables that will be passed onto all Thoras components
env: []

# -- Proxy settings passed to all Thoras components
proxy:
  httpProxy: ""
  httpsProxy: ""
  noProxy: ""

featureFlags:
  enableNodeDetailsCollector: true
  # When enabled, AST scale mode may be configured via API
  enableUpdateScaleModeApi: false
  # When enabled, the API server serves container logs and the dashboard shows
  # the Logs column on the pod table. Both sides read this single value, since
  # enabling only the dashboard yields a Logs button the API server refuses.
  enablePodLogStreaming: false
  thorasManageThoras:
    enabled: true
    # Recommendation Mode by default
    mode: "recommendation"
    # When true, the metrics-collector AST follows `mode` above instead of
    # being pinned to observation mode. Defaults to false since WAL issues
    # with metrics-collector autonomous mode are still being resolved.
    metricsCollectorFollowsMode: true
    updateMode: "in_place_or_recreate"
    db:
      updateMode: "in_place_or_recreate"
      # Look 4h ahead by default
      forecastBlocks: "4h0s"
      # Forecast once per hour by default
      forecastCron: "17 * * * *"
  enablePrometheusMetricScraping: false
  enablePgLargeObjectStorage: true
  enableNoBlobApiServer: false
  enableForecastQueueStats: false
  enableInformersStripManagedFields: true
  enableTypedInformers: true
  enableDisruptionSchedulerWorker: true
  enableAstRecordMirroring: true
  enableForecastCollectorAntiAffinity: false
  enableMultiDimensional: false

# Shared secret Thoras components send to the API server. Toggled with
# apiClientSecret.enabled (default true; components authenticate to the API
# server with a shared bearer token).
apiClientSecret:
  # Seeded by config-controller when empty. Set a value to pin it in
  # `thoras-helm-shared` instead; apiClientSecret.existingSecret takes
  # precedence over both. Changing a pinned value requires a manual rollout of
  # dependent workloads; see README > "Rotating secrets".
  secret: ""
  # Point at a pre-existing Secret you manage. Mutually exclusive with
  # apiClientSecret.secret.
  existingSecret:
    secretName: ""
    secretKey: "api-client-secret"

# Cost refresh batching configuration (shared by thorasApiServerV2 and thorasWorker)
costRefreshBatching:
  enabled: true
  batchSize: 200
  maxConcurrency: 5

# Enable Slack errors
slackErrorsEnabled: false

# Set Slack notification Webhook URL directly (or alternatively use
# use slackWebhookUrlSecretRef to reference an existing secret
slackWebhookUrl: ""

# If you'd like to reference an existing secret, use these two values
# to indicate the secret name and data key
slackWebhookUrlSecretRefName: ""
slackWebhookUrlSecretRefKey: ""

cloudSync:
  baseUrl: "https://console.thoras.ai"

  clusterKeyID: ""

  # Set cluster key directly (or alternatively use use clusterKeySecretRef to
  # reference an existing secret. Sync is disabled if no cluster key is
  # provided.
  clusterKey: ""

  # If you'd like to reference an existing secret, use these two values to
  # indicate the secret name and data key
  clusterKeySecretRefName: ""
  clusterKeySecretRefKey: ""

# External TimescaleDB configuration. When set, the chart skips deploying the
# in-cluster TimescaleDB and configures all components to use the external
# database instead. The TimescaleDB extension must be pre-installed and managed
# externally.
externalTimescale:
  # Full postgres DSN including the database name,
  # e.g. "postgres://user:password@host:5432/tsdb?sslmode=require"
  dsn: ""

  # Or reference a pre-existing Secret containing the DSN.
  # The secret key must contain the full postgres DSN including the database name.
  secretRefName: ""
  secretRefKey: ""

# Default PostgreSQL connection-pool settings for the api-server, operator,
# and worker. Each component can override any of these under its own
# `postgresql` block.
postgresql:
  # Maximum number of connections in the pool.
  maxConns: 20
  # Maximum amount of time a connection may sit idle before being closed.
  maxConnIdleTime: 5m
  # Maximum amount of time a connection may be reused before being closed.
  maxConnLifetime: 1h

rbac:
  namespaces: []

thorasOperator:
  replicas: 2
  postUpgradeHook:
    # After each `helm upgrade`, runs a Job that executes the operator's
    # post-upgrade steps: one-off migrations that bring cluster state written by
    # an older version in line with the version being installed. Every step is
    # idempotent, so a run that is skipped or fails is simply picked up by the
    # next upgrade.
    #
    # The Job gates the upgrade: if a step fails, the upgrade fails. Disable only
    # to unblock an upgrade that a step is failing.
    #
    # Requires thorasVersion 4.120.0 or newer; earlier images have no
    # `post-upgrade` subcommand and the Job will fail.
    enabled: true
  # Overrides for the global `postgresql` connection-pool settings. Any field
  # left unset falls back to the corresponding `postgresql` default.
  postgresql:
    maxConns: ""
    maxConnIdleTime: ""
    maxConnLifetime: ""
  # Resource upperbound used when thorasManageThoras is enabled. Empty means
  # no upperbound. Use K8s resource.Quantity syntax (e.g. "2", "4Gi").
  upperbound:
    cpu: ""
    memory: ""
  # OOM remediation used when thorasManageThoras is enabled. Enabled by
  # default so that an OOM on a Thoras workload raises its memory floor via
  # the operator's standard OOM remediation flow. stabilization_window is a
  # duration string (e.g. "1h"); empty defers to the operator default of
  # max(forecast_interval, 1h).
  oom_remediation:
    enabled: true
    stabilization_window: ""
  serviceAccount:
    name: thoras-operator
  podAnnotations: {}
  labels: {}
  # PodDisruptionBudget. Defaults to maxUnavailable: 1 when neither field is set
  # below. minAvailable takes precedence if both are set.
  pdb:
    enabled: true
    maxUnavailable: 1
    # minAvailable:
  service:
    annotations: {}
  # Specify the complete resources block (takes precedence if set)
  resources: {}
  # Legacy field for backward compatibility (used if resources is empty)
  limits:
    memory: 4Gi
  # Legacy field for backward compatibility (used if resources is empty)
  requests:
    cpu: 100m
    memory: 1Gi
  prometheus:
    enabled: true
    port: 9101
  pprof:
    enabled: false
  # Set to true to apply global affinity rules to this component
  # (also applies the global affinity to the chart's hook jobs)
  useGlobalAffinity: true
  # Component-specific affinity (merged with global if useGlobalAffinity is true)
  affinity: {}
  # Component-specific priorityClassName (takes precedence over the global priorityClassName)
  priorityClassName: ""
  # Component-specific topologySpreadConstraints (replaces the global list when non-empty)
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: thoras-operator
  # Webhook certificate generation configuration
  webhookCertGen:
    imageTag: v1.4.4
    # When enabled, cert-manager provisions the thoras-tls-certs secret and
    # injects the CA bundle into the webhook configurations. The bundled
    # kube-webhook-certgen Jobs (and their RBAC/NetworkPolicy/registry secret)
    # are skipped. Requires cert-manager to be installed in the cluster.
    certManager:
      enabled: false
      ca:
        # Long-lived CA that signs the webhook leaf cert, so leaf renewals
        # don't rotate the injected CA bundle. cert-manager auto-renews the CA
        # reusing the same key; rotating the key requires deleting the
        # thoras-webhooks-ca secret and Certificate.
        duration: 87600h # 10y
  # namespaceSelector applied to all webhook configurations. Set to null when
  # using an admission enforcer (e.g. OPA Gatekeeper's admissionsenforcer) that
  # manages namespaceSelector itself, to avoid upgrade conflicts:
  #   thorasOperator.webhooks.namespaceSelector: null
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: "kubernetes.io/metadata.name"
          operator: NotIn
          values:
            - kube-system
            - kube-node-lease
    reinvocationPolicy:
      pods: IfNeeded
      scale: Never
  extraEgressRules: []
  extraIngressRules: []

metricsCollector:
  # Resource upperbound used when thorasManageThoras is enabled. Empty means
  # no upperbound. Use K8s resource.Quantity syntax (e.g. "2", "4Gi").
  upperbound:
    cpu: ""
    memory: ""
  # OOM remediation used when thorasManageThoras is enabled. Enabled by
  # default so that an OOM on a Thoras workload raises its memory floor via
  # the operator's standard OOM remediation flow. stabilization_window is a
  # duration string (e.g. "1h"); empty defers to the operator default of
  # max(forecast_interval, 1h).
  oom_remediation:
    enabled: true
    stabilization_window: ""
  persistence:
    # Leave unset (null) to auto-detect: persistence turns on if you set any of
    # storageClassName / pvcStorageRequestSize / createEFSStorageClass.fileSystemId.
    # Set explicitly to true/false to override auto-detection (false always wins).
    enabled: null
    volumeName: ""
    # Empty uses the cluster's default StorageClass. Set to bind a specific class.
    storageClassName: ""
    accessMode: "ReadWriteOnce"
    createEFSStorageClass:
      fileSystemId: ""
    # Empty defaults to 3Gi (applied in the PVC template).
    pvcStorageRequestSize: ""
  podAnnotations: {}
  labels: {}
  # PodDisruptionBudget. Defaults to maxUnavailable: 1 when neither field is set
  # below. minAvailable takes precedence if both are set.
  pdb:
    enabled: false
    maxUnavailable: 1
    # minAvailable:
  service:
    annotations: {}
  serviceAccount:
    name: thoras-collector
  init:
    imageTag: "3.23.3"
    # Specify the complete resources block (takes precedence if set)
    resources: {}
    # Legacy field for backward compatibility (used if resources is empty)
    limits:
      memory: "8192Mi"
    # Legacy field for backward compatibility (used if resources is empty)
    requests:
      cpu: "16m"
      memory: "32Mi"
  timescale:
    image: "timescaledb"
    imageTag: "2.28.2-pg16"
    extensionVersion: "2.28.2"
    name: timescale
    containerPort: 5432
    # Specify the complete resources block (takes precedence if set)
    resources: {}
    # Legacy field for backward compatibility (used if resources is empty)
    limits:
      memory: "16384Mi"
    # Legacy field for backward compatibility (used if resources is empty)
    requests:
      cpu: "1024m"
      memory: "3072Mi"
    config:
      enabled: false
      content: ""
    walRecovery:
      # If the database fails to start, Thoras assume WAL corruption and reset
      # the WAL: when enabled, pg_resetwal -f is run to force recovery,
      # discarding WAL after the last valid checkpoint (lossy, but unblocks
      # startup). When disabled, the corrupt state is left as-is.
      enabled: true
      timeoutSeconds: 300
  blobService:
    logLevel: "info"
    pprof:
      enabled: false
    containerPort: 8080
    port: 80
    # Specify the complete resources block (takes precedence if set)
    resources: {}
    # Legacy field for backward compatibility (used if resources is empty)
    limits:
      memory: "8192Mi"
    # Legacy field for backward compatibility (used if resources is empty)
    requests:
      cpu: "16m"
      memory: "128Mi"
  # Set to true to apply global affinity rules to this component
  useGlobalAffinity: true
  # Component-specific affinity (merged with global if useGlobalAffinity is true)
  affinity: {}
  # Component-specific priorityClassName (takes precedence over the global priorityClassName)
  priorityClassName: ""
  # Component-specific topologySpreadConstraints (replaces the global list when non-empty)
  topologySpreadConstraints: []
  extraEgressRules: []
  extraIngressRules: []

thorasApiServerV2:
  # Overrides for the global `postgresql` connection-pool settings. Any field
  # left unset falls back to the corresponding `postgresql` default.
  postgresql:
    maxConns: ""
    maxConnIdleTime: ""
    maxConnLifetime: ""
  # Resource upperbound used when thorasManageThoras is enabled. Empty means
  # no upperbound. Use K8s resource.Quantity syntax (e.g. "2", "4Gi").
  upperbound:
    cpu: ""
    memory: ""
  # OOM remediation used when thorasManageThoras is enabled. Enabled by
  # default so that an OOM on a Thoras workload raises its memory floor via
  # the operator's standard OOM remediation flow. stabilization_window is a
  # duration string (e.g. "1h"); empty defers to the operator default of
  # max(forecast_interval, 1h).
  oom_remediation:
    enabled: true
    stabilization_window: ""
  rbac:
    create: true
  serviceAccount:
    name: thoras-api
  containerPort: 8080
  podAnnotations: {}
  labels: {}
  # PodDisruptionBudget. Defaults to maxUnavailable: 1 when neither field is set
  # below. minAvailable takes precedence if both are set.
  pdb:
    enabled: true
    maxUnavailable: 1
    # minAvailable:
  service:
    annotations: {}
  replicas: 1
  # Specify the complete resources block (takes precedence if set)
  resources: {}
  # Legacy field for backward compatibility (used if resources is empty)
  limits:
    memory: 4Gi
  # Legacy field for backward compatibility (used if resources is empty)
  requests:
    cpu: 128m
    memory: 1Gi
  port: 80
  logLevel: "info"
  prometheus:
    enabled: true
  pprof:
    enabled: false
  enableViewCacheQueryLiveJoin: true
  # Set to true to apply global affinity rules to this component
  useGlobalAffinity: true
  # Component-specific affinity (merged with global if useGlobalAffinity is true)
  affinity: {}
  # Component-specific priorityClassName (takes precedence over the global priorityClassName)
  priorityClassName: ""
  # Component-specific topologySpreadConstraints (replaces the global list when non-empty).
  # Defaults to a soft spread of API server pods across nodes; ScheduleAnyway keeps this
  # a preference, so scheduling never blocks when nodes are scarce.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: thoras-api-server-v2
  extraEgressRules: []
  extraIngressRules: []

thorasWorker:
  enabled: true
  # Overrides for the global `postgresql` connection-pool settings. Any field
  # left unset falls back to the corresponding `postgresql` default.
  postgresql:
    maxConns: ""
    maxConnIdleTime: ""
    maxConnLifetime: ""
  # Resource upperbound used when thorasManageThoras is enabled. Empty means
  # no upperbound. Use K8s resource.Quantity syntax (e.g. "2", "4Gi").
  upperbound:
    cpu: ""
    memory: ""
  # OOM remediation used when thorasManageThoras is enabled. Enabled by
  # default so that an OOM on a Thoras workload raises its memory floor via
  # the operator's standard OOM remediation flow. stabilization_window is a
  # duration string (e.g. "1h"); empty defers to the operator default of
  # max(forecast_interval, 1h).
  oom_remediation:
    enabled: true
    stabilization_window: ""
  serviceAccount:
    name: thoras-worker
  podAnnotations: {}
  labels: {}
  # PodDisruptionBudget. Defaults to maxUnavailable: 1 when neither field is set
  # below. minAvailable takes precedence if both are set.
  pdb:
    enabled: false
    maxUnavailable: 1
    # minAvailable:
  service:
    annotations: {}
  replicas: 1
  # Specify the complete resources block (takes precedence if set)
  resources: {}
  # Legacy field for backward compatibility (used if resources is empty)
  limits:
    memory: 4Gi
  # Legacy field for backward compatibility (used if resources is empty)
  requests:
    cpu: 128m
    memory: 1Gi
  logLevel: "info"
  prometheus:
    enabled: true
    port: 9102
  pprof:
    enabled: false
  # Cost will not work in the dashboard if this is disabled. Used for debugging purposes.
  enableAstViewCacheRefreshWorker: true
  enableAstViewCacheStateReconcilerWorker: true
  enableMetricIntegrityWorker: true
  enableDeploymentMonitorWorker: true
  enableUnifiedAstUtilizationMonitor: true
  forecastJobTimeoutInterval: "2m"
  trainJobTimeoutInterval: "10m"
  # Times a stuck forecast may be fast-tracked to the head of the queue before it
  # falls back to its normal schedule. Prevents one workload whose forecasts keep
  # overrunning forecastJobTimeoutInterval from monopolising the forecast workers.
  # Set to -1 to disable the cap.
  forecastRescueMaxAttempts: 3
  # Set to true to apply global affinity rules to this component
  useGlobalAffinity: true
  # Component-specific affinity (merged with global if useGlobalAffinity is true)
  affinity: {}
  # Component-specific priorityClassName (takes precedence over the global priorityClassName)
  priorityClassName: ""
  # Component-specific topologySpreadConstraints (replaces the global list when non-empty)
  topologySpreadConstraints: []
  extraEgressRules: []
  extraIngressRules: []

# Leader-elected controller that seeds the credentials you did not supply into
# the `thoras-config-controller` Secret, migrates pre-5.0 chart-generated
# values into it, and rolls dependent workloads when watched config changes.
# See README > Thoras Config Controller.
thorasConfigController:
  # Disabling is only valid when every credential is pinned in values or points
  # at an existing Secret; otherwise the chart fails, since nothing else
  # creates the seeded Secret.
  enabled: true
  serviceAccount:
    name: thoras-config-controller
  podAnnotations: {}
  labels: {}
  # PodDisruptionBudget. Defaults to maxUnavailable: 1 when neither field is set
  # below. minAvailable takes precedence if both are set.
  pdb:
    enabled: false
    maxUnavailable: 1
    # minAvailable:
  service:
    annotations: {}
  # Must stay 1: only the leader reconciles, and non-leader replicas never pass
  # their readiness probe.
  replicas: 1
  # Specify the complete resources block (takes precedence if set)
  resources: {}
  # Legacy field for backward compatibility (used if resources is empty)
  limits:
    memory: 256Mi
  # Legacy field for backward compatibility (used if resources is empty)
  requests:
    cpu: 10m
    memory: 64Mi
  logLevel: "info"
  prometheus:
    enabled: true
    port: 9103
  pprof:
    enabled: false
  # Write seeded and migrated values to the managed Secret. With this off the
  # controller only drives rollouts, and any unseeded credential stays missing.
  enableSeeding: true
  # Watch the ConfigMaps below and roll their consumers on change.
  enableConfigMapMonitoring: true
  # Safety switch: with this off the controller logs the checksum diffs it
  # would apply but never touches a pod template.
  enableRestartRollouts: true
  pollInterval: "30s"
  # Coalescing window after a change is first seen, before a rollout starts.
  rolloutDebounce: "10s"
  # Per-workload readiness deadline. A tier that overruns aborts the sequence.
  rolloutTimeout: "5m"
  # Strict sequential restart tiers: every workload in a tier must go Ready
  # before the next tier is touched. Workloads not listed here are restarted
  # last, together.
  restartOrder:
    - metrics-collector
    - thoras-operator
    - thoras-worker
    - thoras-api-server-v2
    - thoras-forecast-worker
    - thoras-dashboard
  # Never restarted. The controller must exclude itself; the chart rolls it via
  # a config checksum instead.
  restartExclude:
    - thoras-config-controller
  # ConfigMaps to watch in addition to the ones this chart owns. Needed only
  # when a workload of yours in this namespace consumes a ConfigMap you want
  # rolled automatically.
  extraWatchConfigMaps: []
  # Set to true to apply global affinity rules to this component
  useGlobalAffinity: true
  # Component-specific affinity (merged with global if useGlobalAffinity is true)
  affinity: {}
  # Component-specific priorityClassName (takes precedence over the global priorityClassName)
  priorityClassName: ""
  # Component-specific topologySpreadConstraints (replaces the global list when non-empty)
  topologySpreadConstraints: []
  extraEgressRules: []
  extraIngressRules: []

thorasDashboard:
  enabled: true
  # Resource upperbound used when thorasManageThoras is enabled. Empty means
  # no upperbound. Use K8s resource.Quantity syntax (e.g. "2", "4Gi").
  upperbound:
    cpu: ""
    memory: ""
  # OOM remediation used when thorasManageThoras is enabled. Enabled by
  # default so that an OOM on a Thoras workload raises its memory floor via
  # the operator's standard OOM remediation flow. stabilization_window is a
  # duration string (e.g. "1h"); empty defers to the operator default of
  # max(forecast_interval, 1h).
  oom_remediation:
    enabled: true
    stabilization_window: ""
  serviceAccount:
    name: thoras-dashboard
    create: true
  rbac:
    create: true
  podAnnotations: {}
  labels: {}
  # PodDisruptionBudget. Defaults to maxUnavailable: 1 when neither field is set
  # below. minAvailable takes precedence if both are set.
  pdb:
    enabled: false
    maxUnavailable: 1
    # minAvailable:
  # Container port for the Thoras Dashboard. Owned by the oauth2-proxy
  # sidecar when thorasDashboard.auth.enabled (default), otherwise by nginx
  # directly. Target this port from the Service or Ingress.
  containerPort: 8080
  # Specify the complete resources block (takes precedence if set)
  resources: {}
  # Legacy field for backward compatibility (used if resources is empty)
  limits:
    memory: 2Gi
  # Legacy field for backward compatibility (used if resources is empty)
  requests:
    cpu: 100m
    memory: 128Mi
  port: 80
  replicas: 1
  service:
    type: ClusterIP
    annotations: {}
    # Overrides Service targetPort; defaults to thorasDashboard.containerPort.
    targetPort: ""
  # HTTP auth via an oauth2-proxy sidecar. Enabled by default; disable to
  # front the dashboard with your own auth. Credentials are only meaningful
  # behind TLS - terminate TLS at your ingress.
  auth:
    enabled: true
    # htpasswd: chart-managed username + password (default, self-contained).
    # oidc:     OIDC/OAuth2 via your identity provider (Okta, Entra, ...);
    #           reads client-id/client-secret/cookie-secret from a Secret
    #           you already manage.
    # Fields under the unused mode's block are silently ignored.
    mode: htpasswd
    imageTag: v7.15.4-alpine
    # Marks session cookies as Secure. Enabling requires TLS at the edge and
    # breaks Safari when reaching the dashboard through kubectl port-forward.
    # Recommended in production: enable this and terminate TLS at the edge.
    cookieSecure: false
    # oauth2-proxy sidecar resources.
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 32Mi
    # Appended to the sidecar's args verbatim. Applies to both modes.
    # Flags here override any equivalent directive in the chart-generated
    # oauth2-proxy.cfg (oauth2-proxy resolves CLI flags after config-file
    # directives).
    extraArgs: []
    # Consulted when thorasDashboard.auth.mode: htpasswd.
    htpasswd:
      username: thoras
      # Generated if empty. Setting a value will override existing value and
      # rotates the secret on the next upgrade.
      # thorasDashboard.auth.htpasswd.existingSecret takes precedent.
      # Rotation requires a manual rollout of dependent workloads; see
      # README > "Rotating chart-managed credentials".
      password: ""
      # Generated if empty. Setting a value will override existing value and
      # rotates the secret on the next upgrade, invalidating all logged-in
      # dashboard sessions. thorasDashboard.auth.htpasswd.existingSecret
      # takes precedent. Rotation requires a manual rollout of dependent
      # workloads; see README > "Rotating chart-managed credentials".
      # Must be 16, 24, or 32 bytes raw, or a base64 string that decodes to
      # that length.
      cookieSecret: ""
      # Point at a pre-existing Secret you manage. Mutually exclusive with
      # thorasDashboard.auth.htpasswd.password /
      # thorasDashboard.auth.htpasswd.cookieSecret above.
      existingSecret:
        secretName: ""
        passwordKey: dashboard-auth-password
        cookieSecretKey: dashboard-auth-cookie-secret
      # Init container that regenerates the htpasswd file at pod start
      # (keeps the Secret deterministic - it only holds the plaintext).
      initImage:
        imageTag: "2.4.68-alpine3.24"
        resources:
          limits:
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
    # Consulted when thorasDashboard.auth.mode: oidc. The chart never
    # generates client credentials;
    # thorasDashboard.auth.oidc.existingSecret.secretName is required and
    # points at a Secret you manage. Opens broad egress (0.0.0.0/0:443) on
    # the dashboard NetworkPolicy so the sidecar can reach the IdP. Tighten
    # via a separate NetworkPolicy.
    oidc:
      # oauth2-proxy provider name (oidc | okta | entra-id | google | ...).
      provider: oidc
      # e.g. https://<okta-domain>/oauth2/default or
      # https://login.microsoftonline.com/<tenant-id>/v2.0
      issuerURL: ""
      # e.g. https://thoras.example.com/oauth2/callback; must match the URI
      # registered on the IdP app.
      redirectURL: ""
      # Rendered as repeated oauth2-proxy email_domains entries.
      emailDomains: ["*"]
      skipProviderButton: true
      insecureAllowUnverifiedEmail: false
      existingSecret:
        # Required. e.g. oauth2-proxy-secrets.
        secretName: ""
        clientIDKey: client-id
        clientSecretKey: client-secret
        cookieSecretKey: cookie-secret
  ingress:
    enabled: false
    ingressClassName: "nginx"
    annotations: {}
    hosts:
      - host: thoras.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  gatewayAPI:
    enabled: false
    annotations: {}
    parentRefs:
      - name: gateway
        namespace: default
    hostnames:
      - thoras.local
    path: /
    pathType: PathPrefix
  extras:
    show_savings: true
    cost_analysis: true
    cost_simulator: false
    rolling_savings: true
    cost_breakdown_v2: true
    node_overrides: true
    show_node_details: true
    # Show option in the dashboard to pause scaling cluster wide.
    enable_scaling_pause: true
    # Experimental: highlight resource changes above these thresholds on the
    # Observation view so the biggest changes stand out; smaller ones are
    # muted. Keep disabled until validated with design; not yet for GA.
    enable_change_highlighting: false
    highlight_cpu_change_above_millicores: 50
    highlight_memory_change_above_mib: 100
  # Set to true to apply global affinity rules to this component
  useGlobalAffinity: true
  # Component-specific affinity (merged with global if useGlobalAffinity is true)
  affinity: {}
  # Component-specific priorityClassName (takes precedence over the global priorityClassName)
  priorityClassName: ""
  # Component-specific topologySpreadConstraints (replaces the global list when non-empty)
  topologySpreadConstraints: []
  extraEgressRules: []
  extraIngressRules: []
  extraContainers: []

thorasMonitor:
  unittesting: false
  labels: {}
  # Raw monitor configuration YAML. Configures the named Slack alerts under
  # `alerts` (enable/disable and per-alert notification_cooldown) and the
  # `general` block: cluster name, monitor_cadence, and optional metadata
  # key/value pairs surfaced on every alert (e.g. region: euw1, to disambiguate
  # clusters that share a name across regions).
  config: |

thorasForecast:
  serviceAccount:
    name: thoras-forecast-worker
  skipCache: false
  ignoreNewPods: true
  podEligibilityMinRunningTime: "2m"
  enableDecoupledTraining: true
  trainingJitterMinutes: 0
  useAstMetricsSeries: true
  useForecasterComputedMetricId: true
  writeUbjArtifacts: true
  # Minimum lookback window required before autonomous scaling is enabled.
  minLookbackToScale: "24h"
  worker:
    # Number of forecast-worker replicas. Leave unset to let the scaler manage
    # the replica count. Set to a fixed number to pin a static count and disable
    # the scaler.
    # replicas: 1
    # Resource upperbound used when thorasManageThoras is enabled. Empty means
    # no upperbound. Use K8s resource.Quantity syntax (e.g. "2", "4Gi").
    upperbound:
      cpu: "2"
      memory: "4Gi"
    # OOM remediation used when thorasManageThoras is enabled. Enabled by
    # default so that an OOM on the forecast worker raises its memory floor
    # via the operator's standard OOM remediation flow. stabilization_window
    # is a duration string (e.g. "1h"); empty defers to the operator default
    # of max(forecast_interval, 1h).
    oom_remediation:
      enabled: true
      stabilization_window: ""
    pollingInterval: 15
    podAnnotations: {}
    retrainSteadyStateHours: ""
    retrainOverrideHours: ""
    maxTimeseriesMetricCacheSizeMb: 1000
    labels: {}
    # PodDisruptionBudget. Defaults to maxUnavailable: 1 when neither field is
    # set below. minAvailable takes precedence if both are set.
    pdb:
      enabled: false
      maxUnavailable: 1
      # minAvailable:
    # Specify the complete resources block (takes precedence if set)
    resources: {}
    # Legacy field for backward compatibility (used if resources is empty)
    limits:
      memory: 2Gi
      cpu: 2
    # Legacy field for backward compatibility (used if resources is empty)
    requests:
      cpu: 1
      memory: 256Mi
    forecastTimeout: 600
    scaler:
      interval: "1m"
      minReplicas: 1
      maxReplicas: 100
      astsPerReplica: 67
  prometheus:
    enabled: true
    port: 9101
    # Address the metrics server binds to. Defaults to the dual-stack
    # wildcard so it's reachable on both IPv4-only and IPv6-only clusters.
    host: "::"
  service:
    annotations: {}
  # Set to true to apply global affinity rules to this component
  useGlobalAffinity: true
  # Component-specific affinity (merged with global if useGlobalAffinity is true)
  affinity: {}
  # Component-specific priorityClassName (takes precedence over the global priorityClassName)
  priorityClassName: ""
  # Component-specific topologySpreadConstraints (replaces the global list when non-empty)
  topologySpreadConstraints: []
  # Set to false to disable the default self anti-affinity between forecast-worker replicas
  enableSelfAntiAffinity: false
  extraEgressRules: []
  extraIngressRules: []

# K8s client max queries per second
queriesPerSecond: "50"

# nodeSelector is used to assign components to specific nodes.
# Applied to every component and to the chart's hook jobs.
nodeSelector: {}

# tolerations are applied to every component and to the chart's hook jobs.
tolerations: []

# Global affinity rules that components can opt into
affinity: {}

# priorityClassName is used to assign a PriorityClass to all components.
# Component-specific priorityClassName takes precedence when set.
priorityClassName: ""

# topologySpreadConstraints applied to all components.
# A component-specific list fully replaces this one when set (lists are not merged).
# Setting this also overrides the default spread configured for the API server.
topologySpreadConstraints: []

# Create Prometheus ServiceMonitors for all Prometheus-enabled components
serviceMonitor:
  enabled: false
  # Scrape interval (e.g. "30s"). If empty, uses Prometheus default.
  interval: ""
  # Additional labels to add to all ServiceMonitors (e.g. for Prometheus discovery)
  additionalLabels: {}

# Global pod annotations applied to all deployments (component podAnnotations override these)
podAnnotations: {}

# Global Labels support
labels: {}

# Flux configuration
flux:
  # Set to true if deploying via Flux to prevent drift detection from reverting
  # operator-initiated rollout restarts.
  enabled: false
  # Field manager name used when patching Kubernetes resources (e.g. restartedAt).
  # Override only if your Flux installation uses a non-default field manager name.
  fieldManager: "flux-client-side-apply"

# Utilization thresholds in which a target is considered over or under provisioned
utilizationThresholds:
  overprovisioned: 60
  underprovisioned: 92
  idle: 5
