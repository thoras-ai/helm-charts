{{- if and .Values.networkPolicy.enabled .Values.thorasDashboard.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: thoras-dashboard
  ingress:
  # Allow all ingress from endpoints within the same namespace
  - fromEndpoints:
    - {}
  # Allow ingress from users and ingress controllers on the port the Service
  # targets: the oauth2-proxy sidecar port when auth is enabled, otherwise
  # the raw dashboard nginx port. Same-pod traffic between the sidecar and
  # nginx is not gated by CiliumNetworkPolicy.
  - fromEntities:
    - all
    toPorts:
    - ports:
      {{- if .Values.thorasDashboard.auth.enabled }}
      - port: "{{ .Values.thorasDashboard.auth.containerPort }}"
        protocol: TCP
      {{- else }}
      - port: "{{ .Values.thorasDashboard.containerPort }}"
        protocol: TCP
      {{- end }}
  {{- with .Values.thorasDashboard.extraIngressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  # Allow all egress to endpoints within the same namespace
  - toEndpoints:
    - {}
  # Allow DNS resolution
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: kube-dns
        k8s:io.kubernetes.pod.namespace: kube-system
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY
      rules:
        dns:
        - matchPattern: "*"
  {{- with .Values.thorasDashboard.extraEgressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
