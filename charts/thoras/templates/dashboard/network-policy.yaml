{{- if and .Values.networkPolicy.enabled .Values.thorasDashboard.enabled }}
{{- if eq .Values.networkPolicy.flavor "kubernetes" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: thoras-dashboard
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow all ingress from pods within the same namespace
  - from:
    - podSelector: {}
  # Public dashboard port (thorasDashboard.containerPort). Owned by nginx or
  # the oauth2-proxy sidecar depending on thorasDashboard.auth.enabled; the
  # policy is the same either way.
  - ports:
    - port: {{ .Values.thorasDashboard.containerPort }}
      protocol: TCP
  {{- with .Values.thorasDashboard.extraIngressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  # Allow all egress to pods within the same namespace
  - to:
    - podSelector: {}
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  {{- with .Values.thorasDashboard.extraEgressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- else if eq .Values.networkPolicy.flavor "cilium" }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: thoras-dashboard
  ingress:
  # Allow all ingress from endpoints within the same namespace
  - fromEndpoints:
    - {}
  # Public dashboard port (thorasDashboard.containerPort). Owned by nginx or
  # the oauth2-proxy sidecar depending on thorasDashboard.auth.enabled; the
  # policy is the same either way.
  - fromEntities:
    - all
    toPorts:
    - ports:
      - port: "{{ .Values.thorasDashboard.containerPort }}"
        protocol: TCP
  {{- with .Values.thorasDashboard.extraIngressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  # Allow all egress to endpoints within the same namespace
  - toEndpoints:
    - {}
  # Allow DNS resolution
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: kube-dns
        k8s:io.kubernetes.pod.namespace: kube-system
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY
      rules:
        dns:
        - matchPattern: "*"
  {{- if and .Values.thorasDashboard.auth.enabled (eq .Values.thorasDashboard.auth.mode "oidc") }}
  # OIDC oauth2-proxy needs egress to the IdP. Scope is world:443 because IdP
  # hostnames resolve to drifting CIDRs; tightening guidance for operators
  # lives in README (Thoras Dashboard Authentication > NetworkPolicy egress).
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  {{- end }}
  {{- with .Values.thorasDashboard.extraEgressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
