{{- if and .Values.thorasDashboard.rbac.create .Values.thorasDashboard.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.thorasDashboard.labels) | nindent 4 }}
  name: {{ .Values.thorasDashboard.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
imagePullSecrets:
  - name: {{ include "thoras.registrySecretName" . }}
{{- end }}
