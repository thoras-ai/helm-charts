{{- if and .Values.thorasDashboard.enabled .Values.thorasDashboard.auth.enabled }}
---
{{- $newPassword := randAlphaNum 24 }}
{{- $newCookieSecret := randAlphaNum 32 }}
apiVersion: v1
kind: Secret
metadata:
  name: thoras-dashboard-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.thorasDashboard.labels) | nindent 4 }}
data:
  {{- /* Precedence matches api-client-secret.yaml and the timescale password:
         the value already in the cluster wins so upgrades don't rotate the
         credential out from under active sessions, then an explicitly
         configured value, then a generated one. Set auth.password to keep
         renders deterministic where `lookup` is unavailable (helm template,
         Argo CD). */}}
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace "thoras-dashboard-auth") }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  {{- $password := (get $secretData "password") | default ((.Values.thorasDashboard.auth.password | default $newPassword) | b64enc) }}
  {{- $cookieSecret := (get $secretData "cookie-secret") | default ($newCookieSecret | b64enc) }}
  username: {{ .Values.thorasDashboard.auth.username | b64enc | quote }}
  password: {{ $password | quote }}
  cookie-secret: {{ $cookieSecret | quote }}
{{- end }}
