{{- if and .Values.thorasDashboard.enabled .Values.thorasDashboard.auth.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: thoras-dashboard-oauth2-proxy-templates
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.thorasDashboard.labels) | nindent 4 }}
data:
  sign_in.html: |
{{ .Files.Get "files/oauth2-proxy-sign-in.html" | indent 4 }}
{{- end }}
