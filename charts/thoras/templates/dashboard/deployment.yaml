{{- if .Values.thorasDashboard.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thoras-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.thorasDashboard.labels) | nindent 4 }}
spec:
  replicas: {{ .Values.thorasDashboard.replicas }}
  selector:
    matchLabels:
      app: thoras-dashboard
  template:
    metadata:
      labels:
        app: thoras-dashboard
        {{- with include "thoras.componentLabels" (dict "root" $ "component" .Values.thorasDashboard.labels) }}
        {{- . | trim | nindent 8 }}
        {{- end }}
      annotations:
        {{- if not .Values.thorasDashboard.unittesting }}
        checksum/configmap: {{ include (print $.Template.BasePath "/dashboard/nginx-config-map.yaml") . | sha256sum }}
        {{- if .Values.thorasDashboard.auth.enabled }}
        checksum/auth-secret: {{ include (print $.Template.BasePath "/dashboard/auth-secret.yaml") . | sha256sum }}
        checksum/oauth2-proxy-config: {{ include (print $.Template.BasePath "/dashboard/oauth2-proxy-config-map.yaml") . | sha256sum }}
        {{- end }}
        {{- end }}
      {{- with include "thoras.podAnnotations" (dict "root" $ "component" .Values.thorasDashboard.podAnnotations) }}
        {{- . | trim | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ .Values.thorasDashboard.serviceAccount.name }}
      {{- if and .Values.imageCredentials.imagePullSecretInDeployment .Values.imageCredentials.secretRef }}
      imagePullSecrets:
      - name: {{ .Values.imageCredentials.secretRef }}
      {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: thoras-dashboard-nginx-config
        {{- if .Values.thorasDashboard.auth.enabled }}
        - name: oauth2-proxy-config
          configMap:
            name: thoras-dashboard-oauth2-proxy-config
        # NOTE: don't set defaultMode < 0444 here. Projected Secret files are
        # owned by uid 0, and the sidecar runs as uid 2000 - a restrictive
        # mode locks the process out of its own cookie secret. readOnly at
        # the mount point already prevents writes.
        - name: oauth2-proxy-secret
          secret:
            secretName: thoras-dashboard-auth
            items:
              - key: cookie-secret
                path: cookie-secret
        - name: oauth2-proxy-generated
          emptyDir: {}
        {{- end }}
      {{- if .Values.thorasDashboard.auth.enabled }}
      initContainers:
      - name: htpasswd-init
        image: {{ .Values.thorasDashboard.auth.htpasswdInit.image.repository }}:{{ .Values.thorasDashboard.auth.htpasswdInit.image.tag }}
        imagePullPolicy: "{{ .Values.thorasDashboard.auth.htpasswdInit.image.pullPolicy }}"
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command:
          - sh
          - -c
          - |
            set -eu
            htpasswd -B -bn "$AUTH_USERNAME" "$AUTH_PASSWORD" > /generated/htpasswd
        env:
          - name: AUTH_USERNAME
            valueFrom:
              secretKeyRef:
                name: thoras-dashboard-auth
                key: username
          - name: AUTH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: thoras-dashboard-auth
                key: password
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
        volumeMounts:
          - name: oauth2-proxy-generated
            mountPath: /generated
      {{- end }}
      containers:
      - image: {{ .Values.imageCredentials.registry }}/thoras-dashboard-v2:{{ default .Values.thorasVersion .Values.thorasDashboard.imageTag }}
        name: thoras-dashboard
        imagePullPolicy: "{{ .Values.imagePullPolicy }}"
        securityContext:
          runAsUser: 101
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        args: ["nginx", "-c", "/tmp/nginx.conf", "-g", "daemon off;"]
        env:
        {{- with include "thoras.globalEnv" . }}
          {{- . | nindent 10 }}
        {{- end }}
          - name: NGINX_ENVSUBST_OUTPUT_DIR
            value: /tmp
        {{- if .Values.featureFlags.enableSimpleAuthSecret }}
          - name: SIMPLE_AUTH_SECRET
            valueFrom:
              secretKeyRef:
                name: api-client-secret
                key: secret
        {{- end }}
        ports:
        - containerPort: {{ .Values.thorasDashboard.containerPort }}
          name: http
        {{- if .Values.thorasDashboard.resources }}
        resources: {{ .Values.thorasDashboard.resources | toYaml | nindent 10 }}
        {{- else }}
        resources:
          limits: {{ .Values.thorasDashboard.limits | toYaml | nindent 12 }}
          requests: {{ .Values.thorasDashboard.requests | toYaml | nindent 12 }}
        {{- end }}
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          exec:
            # TODO: this will cause the dashboard to go live and start serving traffic before it's actually ready
#           #       I believe the purpose of this was to only be marked ready if the backing API server is also healthy?
            command: ["curl", "-sf", "http://thoras-api-server-v2/health"]
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          failureThreshold: 48
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/templates/nginx.conf.template
            subPath: nginx.conf.template
      {{- if .Values.thorasDashboard.auth.enabled }}
      - name: oauth2-proxy
        image: {{ .Values.thorasDashboard.auth.image.repository }}:{{ .Values.thorasDashboard.auth.image.tag }}
        imagePullPolicy: "{{ .Values.thorasDashboard.auth.image.pullPolicy }}"
        securityContext:
          runAsUser: 2000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        args:
          - --config=/etc/oauth2-proxy/config/oauth2-proxy.cfg
          {{- with .Values.thorasDashboard.auth.extraArgs }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        ports:
        - containerPort: {{ .Values.thorasDashboard.auth.containerPort }}
          name: auth
        resources: {{ .Values.thorasDashboard.auth.resources | toYaml | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /ping
            port: auth
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: auth
          periodSeconds: 5
          failureThreshold: 2
        volumeMounts:
          - name: oauth2-proxy-config
            mountPath: /etc/oauth2-proxy/config
            readOnly: true
          - name: oauth2-proxy-secret
            mountPath: /etc/oauth2-proxy/secret
            readOnly: true
          - name: oauth2-proxy-generated
            mountPath: /etc/oauth2-proxy/generated
            readOnly: true
      {{- end }}
      {{- if .Values.thorasDashboard.extraContainers }}
      {{- toYaml .Values.thorasDashboard.extraContainers | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.thorasDashboard.useGlobalAffinity }}
        {{- $globalAffinity := .Values.affinity | default dict | deepCopy }}
        {{- $componentAffinity := .Values.thorasDashboard.affinity | default dict | deepCopy }}
        {{- $mergedAffinity := mustMerge dict $globalAffinity $componentAffinity }}
        {{- with $mergedAffinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
        {{- with .Values.thorasDashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.thorasDashboard.priorityClassName | default .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- include "thoras.topologySpreadConstraints" (dict "root" . "component" .Values.thorasDashboard.topologySpreadConstraints) | nindent 6 }}
{{- end }}
