{{- if or (not .Values.featureFlags.enableNoBlobApiServer) (not (include "thoras.externalTimescaleEnabled" .)) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.metricsCollector.labels) | nindent 4 }}
  name: {{ .Values.metricsCollector.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
imagePullSecrets:
  - name: {{ include "thoras.registrySecretName" . }}
{{- end }}
