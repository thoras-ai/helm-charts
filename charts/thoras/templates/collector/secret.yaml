{{- if and .Values.featureFlags.enableLegacySecretSeeding (not .Values.externalTimescale.secretRefName) }}
---
{{- $newPgPassword := randAlphaNum 16 }}
apiVersion: v1
kind: Secret
metadata:
  name: thoras-timescale-password
  annotations:
    {{- /* Must already be on the live object before the release that stops
           rendering it: Helm refreshes from the cluster before it consults
           the policy. Dropped in 6.0 along with the template. */}}
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
data:
  {{- /* Nothing consumes this Secret; it exists only as a migration source
         for config-controller. */}}
  {{- if include "thoras.externalTimescaleEnabled" . }}
  host: {{ .Values.externalTimescale.dsn | b64enc | quote }}
  {{- else }}
  {{- /* The cluster value wins so an upgrade does not rotate the password out
         from under the running database before config-controller has migrated
         it. `lookup` is unavailable to helm template and Argo CD, so exclude
         this Secret from diffing there. */}}
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace "thoras-timescale-password") }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  {{- $pgPassword := (get $secretData "password") | default ($newPgPassword | b64enc) }}
  password: {{ $pgPassword | quote }}
  {{- /* host must embed password: config-controller refuses to migrate the
         pair when the DSN does not contain it. */}}
  host: {{ (printf "postgres://postgres:%s@%s:%d" ($pgPassword | b64dec) .Values.metricsCollector.timescale.name (.Values.metricsCollector.timescale.containerPort | int)) | b64enc | quote }}
  {{- end }}
{{- end }}
