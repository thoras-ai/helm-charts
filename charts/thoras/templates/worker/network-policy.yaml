{{- if and .Values.networkPolicy.enabled .Values.thorasWorker.enabled }}
{{- if eq .Values.networkPolicy.flavor "kubernetes" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: thoras-worker
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow all ingress from pods within the same namespace
  - from:
    - podSelector: {}
  # Allow metrics scrapes from any namespace (networkPolicy.allowMetricsScraping)
  {{- include "thoras.metricsIngressRule" (dict "root" $ "port" .Values.thorasWorker.prometheus.port "enabled" .Values.thorasWorker.prometheus.enabled) | nindent 2 }}
  {{- with .Values.thorasWorker.extraIngressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  # Allow all egress to pods within the same namespace
  - to:
    - podSelector: {}
  # Allow access to the Kubernetes API server
  {{- include "thoras.apiServerEgressRule" . | nindent 2 }}
  # Allow DNS resolution
  {{- include "thoras.dnsEgressRules" . | nindent 2 }}
  # Allow access to an external TimescaleDB when externalTimescale is configured
  {{- include "thoras.externalDatabaseEgressRule" . | nindent 2 }}
  {{- with .Values.thorasWorker.extraEgressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- else if eq .Values.networkPolicy.flavor "cilium" }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: thoras-worker
  ingress:
  # Allow all ingress from endpoints within the same namespace
  - fromEndpoints:
    - {}
  # Allow metrics scrapes from any namespace (networkPolicy.allowMetricsScraping)
  {{- include "thoras.metricsIngressRuleCilium" (dict "root" $ "port" .Values.thorasWorker.prometheus.port "enabled" .Values.thorasWorker.prometheus.enabled) | nindent 2 }}
  {{- with .Values.thorasWorker.extraIngressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  # Allow all egress to endpoints within the same namespace
  - toEndpoints:
    - {}
  # Allow access to the Kubernetes API server
  - toEntities:
    - kube-apiserver
  # Allow DNS resolution
  {{- include "thoras.dnsEgressRulesCilium" . | nindent 2 }}
  # Allow access to an external TimescaleDB when externalTimescale is configured
  {{- include "thoras.externalDatabaseEgressRuleCilium" . | nindent 2 }}
  {{- with .Values.thorasWorker.extraEgressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
