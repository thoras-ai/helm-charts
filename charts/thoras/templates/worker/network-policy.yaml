{{- if and .Values.networkPolicy.enabled .Values.thorasWorker.enabled }}
{{- $flavor := include "thoras.networkPolicyFlavor" . }}
{{- $w := .Values.thorasWorker }}
{{- $costCollector := or $w.enableCostAndUsageCollector $w.enableHourlyCostCollector }}
{{- $httpsEgress := or $costCollector (eq (include "thoras.cloudSyncActive" .) "true") }}
{{- $podIdentity := or (and $costCollector (ne ($w.costExplorerMode | default "per-cluster") "console")) $w.enableCurIngestion }}
{{- $httpsEgressCidrs := $w.httpsEgressCidrs }}
{{- if kindIs "invalid" $httpsEgressCidrs }}
{{- $httpsEgressCidrs = list "0.0.0.0/0" }}
{{- end }}
{{- if eq $flavor "kubernetes" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: thoras-worker
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow all ingress from pods within the same namespace
  - from:
    - podSelector: {}
  {{- with .Values.thorasWorker.extraIngressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  # Allow all egress to pods within the same namespace
  - to:
    - podSelector: {}
  # Allow access to the Kubernetes API server
  {{- include "thoras.apiServerEgressRule" . | nindent 2 }}
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  {{- if and $httpsEgress $httpsEgressCidrs }}
  # AWS Cost Explorer and the console. Their addresses drift, so this defaults to
  # any :443 egress. A console on another port needs extraEgressRules.
  - to:
    {{- range $httpsEgressCidrs }}
    - ipBlock:
        cidr: {{ . }}
    {{- end }}
    ports:
    - port: 443
      protocol: TCP
  {{- end }}
  {{- if $podIdentity }}
  # The EKS Pod Identity agent, where the worker gets its Cost Explorer role.
  - to:
    - ipBlock:
        cidr: 169.254.170.23/32
    ports:
    - port: 80
      protocol: TCP
  {{- end }}
  {{- with .Values.thorasWorker.extraEgressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- else if eq $flavor "cilium" }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: thoras-worker
  ingress:
  # Allow all ingress from endpoints within the same namespace
  - fromEndpoints:
    - {}
  {{- with .Values.thorasWorker.extraIngressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  # Allow all egress to endpoints within the same namespace
  - toEndpoints:
    - {}
  # Allow access to the Kubernetes API server
  - toEntities:
    - kube-apiserver
  # Allow DNS resolution
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: kube-dns
        k8s:io.kubernetes.pod.namespace: kube-system
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY
      rules:
        dns:
        - matchPattern: "*"
  {{- if and $httpsEgress $httpsEgressCidrs }}
  # AWS Cost Explorer and the console. Their addresses drift, so this defaults to
  # any :443 egress; narrow it with httpsEgressCidrs. A console on another port
  # needs extraEgressRules.
  - toCIDR:
    {{- toYaml $httpsEgressCidrs | nindent 4 }}
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  {{- end }}
  {{- if $podIdentity }}
  # The EKS Pod Identity agent, where the worker gets its Cost Explorer role.
  # Cilium sees its address as the node itself, which toCIDR doesn't match.
  - toEntities:
    - host
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
  {{- end }}
  {{- with .Values.thorasWorker.extraEgressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
