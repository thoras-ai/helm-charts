{{- if .Values.thorasOperator.webhookCertGen.certManager.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: thoras-webhooks-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.thorasOperator.labels) | nindent 4 }}
    app.kubernetes.io/component: webhook-certgen
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thoras-webhooks-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.thorasOperator.labels) | nindent 4 }}
    app.kubernetes.io/component: webhook-certgen
spec:
  isCA: true
  commonName: thoras-webhooks-ca
  secretName: thoras-webhooks-ca
  duration: {{ ((.Values.thorasOperator.webhookCertGen.certManager).ca).duration | default "87600h" | quote }}
  privateKey:
    # cert-manager auto-renews this CA at ~2/3 of its duration; since
    # cert-manager v1.18 the default rotationPolicy is Always, which would
    # mint a new CA key on renewal and invalidate the injected caBundle
    # until the next leaf renewal — the no-overlap race this chain exists
    # to prevent. Reusing the key keeps renewed CA certs verifiable
    # against the bundle already injected in the webhook configurations.
    rotationPolicy: Never
  issuerRef:
    name: thoras-webhooks-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: thoras-webhooks-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.thorasOperator.labels) | nindent 4 }}
    app.kubernetes.io/component: webhook-certgen
spec:
  ca:
    secretName: thoras-webhooks-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thoras-tls-certs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.thorasOperator.labels) | nindent 4 }}
    app.kubernetes.io/component: webhook-certgen
spec:
  secretName: thoras-tls-certs
  dnsNames:
    - thoras-webhooks
    - thoras-webhooks.{{ .Release.Namespace }}
    - thoras-webhooks.{{ .Release.Namespace }}.svc
    - thoras-webhooks.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: thoras-webhooks-ca
    kind: Issuer
{{- end }}
