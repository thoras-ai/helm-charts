{{- if and .Values.thorasLicenseKey (not (.Values.imageCredentials.existingSecret).secretName) (not (include "thoras.webhookCertManagerEnabled" .)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: thoras-secret-registry-certgen
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.thorasOperator.labels) | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}
