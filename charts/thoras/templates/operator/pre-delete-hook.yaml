---
apiVersion: batch/v1
kind: Job
metadata:
  name: thoras-pre-delete-hook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.thorasOperator.labels) | nindent 4 }}
    app.kubernetes.io/component: operator-hook
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    # before-hook-creation clears a previously failed job so the next uninstall
    # can retry rather than colliding with it.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # Safety nets: without these, a wedged uninstall step blocks `helm uninstall`
  # indefinitely. The Go code force-strips finalizers after a 5-minute grace
  # period; activeDeadlineSeconds is a hard backstop in case the code itself hangs.
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      name: {{ .Release.Name }}
      labels:
        {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.thorasOperator.labels) | nindent 8 }}
        app.kubernetes.io/component: operator-hook
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534 # user: nobody
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ .Values.thorasOperator.serviceAccount.name }}
      {{- with (include "thoras.hookJobScheduling" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.thorasOperator.priorityClassName | default .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      restartPolicy: OnFailure
      containers:
      - name: thoras-delete-asts
        image: {{ .Values.imageCredentials.registry }}/services:{{ default .Values.thorasVersion .Values.thorasOperator.imageTag }}
        imagePullPolicy: "{{ .Values.imagePullPolicy }}"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command: ["/app/operator", "uninstall"]
        env:
          {{- with include "thoras.globalEnv" . }}{{- . | nindent 10 }}{{- end }}
        {{- $preDeleteHook := .Values.thorasOperator.preDeleteHook | default dict }}
        {{- if $preDeleteHook.resources }}
        resources: {{ $preDeleteHook.resources | toYaml | nindent 10 }}
        {{- else }}
        resources:
          limits: {{ $preDeleteHook.limits | default dict | toYaml | nindent 12 }}
          requests: {{ $preDeleteHook.requests | default dict | toYaml | nindent 12 }}
        {{- end }}
