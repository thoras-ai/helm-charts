{{- if and .Values.networkPolicy.enabled (not (include "thoras.webhookCertManagerEnabled" .)) }}
{{- if eq .Values.networkPolicy.flavor "kubernetes" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-certgen
  namespace: {{ .Release.Namespace }}
  annotations:
    # Weight -10 ensures this policy exists before the certgen-create job (weight -5) runs.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: webhook-certgen
  policyTypes:
  - Egress
  egress:
  # Allow access to the Kubernetes API server to read/write secrets and patch webhooks
  {{- include "thoras.apiServerEgressRule" . | nindent 2 }}
  # Allow DNS resolution
  {{- include "thoras.dnsEgressRules" . | nindent 2 }}
{{- else if eq .Values.networkPolicy.flavor "cilium" }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-certgen
  namespace: {{ .Release.Namespace }}
  annotations:
    # Weight -10 ensures this policy exists before the certgen-create job (weight -5) runs.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: webhook-certgen
  egress:
  # Allow access to the Kubernetes API server to read/write secrets and patch webhooks
  - toEntities:
    - kube-apiserver
  # Allow DNS resolution
  {{- include "thoras.dnsEgressRulesCilium" . | nindent 2 }}
{{- end }}
{{- end }}
