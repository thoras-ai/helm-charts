{{- if .Values.networkPolicy.enabled }}
{{- if eq .Values.networkPolicy.flavor "kubernetes" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: thoras-operator
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow all ingress from pods within the same namespace
  - from:
    - podSelector: {}
  # Allow webhook callbacks from the Kubernetes API server.
  # Note: standard NetworkPolicy cannot target the API server by label, so this permits
  # ingress from any source on this port. Use the cilium flavor for precise scoping.
  - ports:
    - port: 9443
      protocol: TCP
  # Allow metrics scrapes from any namespace (networkPolicy.allowMetricsScraping)
  {{- include "thoras.metricsIngressRule" (dict "root" $ "port" .Values.thorasOperator.prometheus.port "enabled" .Values.thorasOperator.prometheus.enabled) | nindent 2 }}
  {{- with .Values.thorasOperator.extraIngressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  # Allow all egress to pods within the same namespace
  - to:
    - podSelector: {}
  # Allow access to the Kubernetes API server (metrics-server API is proxied through here)
  {{- include "thoras.apiServerEgressRule" . | nindent 2 }}
  # Allow DNS resolution
  {{- include "thoras.dnsEgressRules" . | nindent 2 }}
  # Allow access to an external TimescaleDB when externalTimescale is configured
  {{- include "thoras.externalDatabaseEgressRule" . | nindent 2 }}
  {{- with .Values.thorasOperator.extraEgressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- else if eq .Values.networkPolicy.flavor "cilium" }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: thoras-operator
  ingress:
  # Allow all ingress from endpoints within the same namespace
  - fromEndpoints:
    - {}
  # Allow webhook callbacks from the Kubernetes API server
  - fromEntities:
    - kube-apiserver
  # Allow metrics scrapes from any namespace (networkPolicy.allowMetricsScraping)
  {{- include "thoras.metricsIngressRuleCilium" (dict "root" $ "port" .Values.thorasOperator.prometheus.port "enabled" .Values.thorasOperator.prometheus.enabled) | nindent 2 }}
  {{- with .Values.thorasOperator.extraIngressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  # Allow all egress to endpoints within the same namespace
  - toEndpoints:
    - {}
  # Allow access to the Kubernetes API server (metrics-server API is proxied through here)
  - toEntities:
    - kube-apiserver
  # Allow DNS resolution
  {{- include "thoras.dnsEgressRulesCilium" . | nindent 2 }}
  # Allow access to an external TimescaleDB when externalTimescale is configured
  {{- include "thoras.externalDatabaseEgressRuleCilium" . | nindent 2 }}
  {{- with .Values.thorasOperator.extraEgressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
