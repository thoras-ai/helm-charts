{{- if .Values.networkPolicy.enabled }}
{{- $name := include "thoras.pauseStateMigrationName" . }}
{{- $flavor := include "thoras.networkPolicyFlavor" . }}
{{- if eq $flavor "kubernetes" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "thoras.pauseStateMigrationAnnotations" (dict "weight" "-20" "job" false) | nindent 4 }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: pause-state-migration
  policyTypes:
  - Egress
  egress:
  # Allow the migration to patch the pause ConfigMap
  {{- include "thoras.apiServerEgressRule" . | nindent 2 }}
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
{{- else if eq $flavor "cilium" }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "thoras.pauseStateMigrationAnnotations" (dict "weight" "-20" "job" false) | nindent 4 }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: pause-state-migration
  egress:
  # Allow the migration to patch the pause ConfigMap
  - toEntities:
    - kube-apiserver
  # Allow DNS resolution
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: kube-dns
        k8s:io.kubernetes.pod.namespace: kube-system
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY
      rules:
        dns:
        - matchPattern: "*"
{{- end }}
{{- end }}
