{{- if and .Values.featureFlags.enableLegacySecretSeeding (eq (include "thoras.apiClientEnabled" .) "true") }}
---
{{- $newAuthSecret := randAlphaNum 32 }}
apiVersion: v1
kind: Secret
metadata:
  name: api-client-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" dict) | nindent 4 }}
  annotations:
    {{- /* Must already be on the live object before the release that stops
           rendering it: Helm refreshes from the cluster before it consults
           the policy. Dropped in 6.0 along with the template. */}}
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
data:
  {{- /* Nothing consumes this Secret; it exists only as a migration source
         for config-controller. The cluster value wins so an upgrade does not
         rotate it out from under the controller before it has migrated, then
         an explicitly configured value, then a generated one. `lookup` is
         unavailable to helm template and Argo CD, so pin apiClientSecret.secret
         there or exclude this Secret from diffing. */}}
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace "api-client-secret") }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  {{- $authSecret := (get $secretData "secret") | default ((.Values.apiClientSecret.secret | default $newAuthSecret) | b64enc) }}
  secret: {{ $authSecret | quote }}
{{- end }}
