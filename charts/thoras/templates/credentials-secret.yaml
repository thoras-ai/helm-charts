{{- /*
Unified credentials Secret. Replaces the six per-credential seed Secrets
that shipped in 4.x (thoras-timescale-password, api-client-secret,
thoras-cloud-sync, thoras-slack, and the derived thoras-timescale-password
`host` field).

Rendering:

- Suppressed entirely when the operator sets `existingSecret.secretName`
  or any per-credential `<credential>.existingSecret.secretName`. In that
  mode the operator supplies the Secret out-of-band (ExternalSecrets,
  sealed-secrets, etc.) and the chart never seeds credentials.

- Values-then-lookup-then-random precedence per key: an explicit value in
  the values file wins for deterministic renders under `helm template` and
  Argo CD; otherwise the in-cluster value is preserved across upgrades;
  otherwise a random value is generated on first install.

- Optional keys (cloud-sync-cluster-key, slack-webhook-url) are only
  emitted when the corresponding integration is enabled (their
  existingSecret.secretKey is non-empty). When disabled the workloads
  skip the env-var bind entirely.

Annotations pin the Secret so an accidental `helm uninstall` or
`argocd app delete` never takes the credentials with it.
*/}}
{{- if include "thoras.credentialsSecretSeedEnabled" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "thoras-credentials") | default dict }}
{{- $existingData := (get $existing "data") | default dict }}

{{- /* Timescale password: only seeded when the chart deploys in-cluster Timescale. */}}
{{- $newTsPassword := randAlphaNum 16 -}}
{{- $tsPassword := (get $existingData "timescale-password") | default ((.Values.metricsCollector.timescale.password | default $newTsPassword) | b64enc) -}}

{{- /* Timescale DSN: user-provided plaintext (external mode) OR derived from the in-cluster password. */}}
{{- $tsDsn := "" -}}
{{- if .Values.externalTimescale.dsn -}}
  {{- $tsDsn = .Values.externalTimescale.dsn | b64enc -}}
{{- else -}}
  {{- $tsDsn = (get $existingData "timescale-dsn") | default (printf "postgres://postgres:%s@%s:%d" ($tsPassword | b64dec) .Values.metricsCollector.timescale.name (.Values.metricsCollector.timescale.containerPort | int) | b64enc) -}}
{{- end -}}

{{- /* API client secret. */}}
{{- $newApiSecret := randAlphaNum 32 -}}
{{- $apiSecret := (get $existingData "api-client-secret") | default ((.Values.apiClientSecret.secret | default $newApiSecret) | b64enc) -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: thoras-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" dict) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
data:
  {{- if not (include "thoras.externalTimescaleEnabled" .) }}
  timescale-password: {{ $tsPassword | quote }}
  {{- end }}
  timescale-dsn: {{ $tsDsn | quote }}
  {{- if .Values.featureFlags.enableSimpleAuthSecret }}
  api-client-secret: {{ $apiSecret | quote }}
  {{- end }}
  {{- if include "thoras.cloudSyncEnabled" . }}
  {{- $newCloudKey := "" -}}
  {{- $cloudKey := (get $existingData (include "thoras.cloudSyncClusterKeyKey" .)) | default ((.Values.cloudSync.clusterKey | default $newCloudKey) | b64enc) }}
  {{ include "thoras.cloudSyncClusterKeyKey" . }}: {{ $cloudKey | quote }}
  {{- end }}
  {{- if include "thoras.slackWebhookEnabled" . }}
  {{- $slackUrl := (get $existingData (include "thoras.slackWebhookUrlKey" .)) | default (.Values.slackWebhook.url | b64enc) }}
  {{ include "thoras.slackWebhookUrlKey" . }}: {{ $slackUrl | quote }}
  {{- end }}
{{- end }}
