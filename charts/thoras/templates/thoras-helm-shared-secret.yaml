{{- /* Secret for credentials pinned in values. Fully deterministic: no
       `lookup`, no generation, so `helm template` and Argo CD render exactly
       what a cluster apply produces and no ignoreDifferences is needed.

       Values left empty are not stored here. They are seeded into
       `thoras-config-controller` by config-controller instead, or read
       straight from a Secret the customer manages. See README > Secrets.

       Changing a value here does not roll consumers on its own; see
       README > "Rotating secrets". */}}

{{- $auth := .Values.thorasDashboard.auth -}}
{{- $htpasswdMode := eq $auth.mode "htpasswd" -}}
{{- $oidcMode := eq $auth.mode "oidc" -}}

{{- /* Mode selector validation. */}}
{{- if and $auth.enabled (not (or $htpasswdMode $oidcMode)) -}}
{{- fail (printf "thorasDashboard.auth.mode must be either \"htpasswd\" or \"oidc\", got %q" $auth.mode) -}}
{{- end -}}

{{- /* apiClientSecret guards. */}}
{{- if and .Values.apiClientSecret.secret .Values.apiClientSecret.existingSecret.secretName -}}
{{- fail "apiClientSecret.secret and apiClientSecret.existingSecret.secretName are mutually exclusive" -}}
{{- end -}}
{{- if and .Values.apiClientSecret.existingSecret.secretName (not .Values.apiClientSecret.existingSecret.secretKey) -}}
{{- fail "apiClientSecret.existingSecret.secretKey is required when secretName is set" -}}
{{- end -}}

{{- /* externalTimescale guards. A half-set ref would reach config-controller
       as a provided value with an empty consumedFrom.key, which it rejects at
       load time, so the pod would never become ready. */}}
{{- if and .Values.externalTimescale.secretRefName (not .Values.externalTimescale.secretRefKey) -}}
{{- fail "externalTimescale.secretRefKey is required when secretRefName is set" -}}
{{- end -}}
{{- if and .Values.externalTimescale.secretRefKey (not .Values.externalTimescale.secretRefName) -}}
{{- fail "externalTimescale.secretRefName is required when secretRefKey is set" -}}
{{- end -}}

{{- /* The bundled TimescaleDB password has no rotation path: config-controller
       seeds it once and never rewrites it, while the running database keeps
       whatever password it was initialised with. */}}
{{- if .Values.metricsCollector.timescale.password -}}
{{- fail "metricsCollector.timescale.password is not supported: the managed database password cannot be rotated, so pinning it would desync the chart from the running database. Remove the field and let config-controller seed it, or move to externalTimescale." -}}
{{- end -}}

{{- /* htpasswd-mode guards. Silent under oidc mode so mixed values are
       ignored. Skipped entirely when thorasDashboard.auth.enabled is
       false. */}}
{{- if and $auth.enabled $htpasswdMode -}}
{{- if and $auth.htpasswd.password $auth.htpasswd.existingSecret.secretName -}}
{{- fail "thorasDashboard.auth.htpasswd.password and thorasDashboard.auth.htpasswd.existingSecret.secretName are mutually exclusive" -}}
{{- end -}}
{{- if and $auth.htpasswd.cookieSecret $auth.htpasswd.existingSecret.secretName -}}
{{- fail "thorasDashboard.auth.htpasswd.cookieSecret and thorasDashboard.auth.htpasswd.existingSecret.secretName are mutually exclusive" -}}
{{- end -}}
{{- /* oauth2-proxy needs the cookie secret to be 16, 24, or 32 bytes after
       any base64 decode. Fail here so a bad value doesn't first surface as
       an oauth2-proxy CrashLoopBackOff at pod start. */}}
{{- if and $auth.htpasswd.cookieSecret (not $auth.htpasswd.existingSecret.secretName) -}}
{{- $s := $auth.htpasswd.cookieSecret -}}
{{- $rawLen := len $s -}}
{{- $decLen := 0 -}}
{{- if and (eq (mod $rawLen 4) 0) (regexMatch "^[A-Za-z0-9+/]+={0,2}$" $s) -}}
{{- $decLen = len (b64dec $s) -}}
{{- end -}}
{{- if not (or (has $rawLen (list 16 24 32)) (has $decLen (list 16 24 32))) -}}
{{- fail (printf "thorasDashboard.auth.htpasswd.cookieSecret must be 16, 24, or 32 bytes (raw) or a base64 string that decodes to that length; got %d bytes (raw), %d bytes (base64-decoded)" $rawLen $decLen) -}}
{{- end -}}
{{- end -}}
{{- if $auth.htpasswd.existingSecret.secretName -}}
{{- $missing := list -}}
{{- if not $auth.htpasswd.existingSecret.passwordKey -}}{{- $missing = append $missing "passwordKey" -}}{{- end -}}
{{- if not $auth.htpasswd.existingSecret.cookieSecretKey -}}{{- $missing = append $missing "cookieSecretKey" -}}{{- end -}}
{{- if $missing -}}
{{- fail (printf "thorasDashboard.auth.htpasswd.existingSecret requires: %s" (join ", " $missing)) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* OIDC-mode guards. */}}
{{- if and $auth.enabled $oidcMode -}}
{{- $missing := list -}}
{{- if not $auth.oidc.issuerURL -}}{{- $missing = append $missing "issuerURL" -}}{{- end -}}
{{- if not $auth.oidc.redirectURL -}}{{- $missing = append $missing "redirectURL" -}}{{- end -}}
{{- if not $auth.oidc.existingSecret.secretName -}}{{- $missing = append $missing "existingSecret.secretName" -}}{{- end -}}
{{- if not $auth.oidc.existingSecret.clientIDKey -}}{{- $missing = append $missing "existingSecret.clientIDKey" -}}{{- end -}}
{{- if not $auth.oidc.existingSecret.clientSecretKey -}}{{- $missing = append $missing "existingSecret.clientSecretKey" -}}{{- end -}}
{{- if not $auth.oidc.existingSecret.cookieSecretKey -}}{{- $missing = append $missing "existingSecret.cookieSecretKey" -}}{{- end -}}
{{- if $missing -}}
{{- fail (printf "thorasDashboard.auth.oidc mode requires: %s" (join ", " $missing)) -}}
{{- end -}}
{{- end -}}

{{- /* Nothing else creates the seeded Secret, so disabling the controller
       while a seedable value is unset leaves consumers pointing at a Secret
       that will never exist. */}}
{{- if not .Values.thorasConfigController.enabled -}}
{{- $seeded := list -}}
{{- range include "thoras.secretPlan" . | fromYamlArray -}}
{{- if eq .mode "seed" -}}
{{- $seeded = append $seeded .name -}}
{{- end -}}
{{- end -}}
{{- if $seeded -}}
{{- fail (printf "thorasConfigController.enabled is false but these values would have to be seeded by it: %s. Pin them in values, point them at existing Secrets, or re-enable the controller." (join ", " $seeded)) -}}
{{- end -}}
{{- end -}}

{{- with include "thoras.helmSharedKeys" . | fromYaml }}
---
apiVersion: v1
kind: Secret
metadata:
  name: thoras-helm-shared
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" $ "component" dict) | nindent 4 }}
data:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
