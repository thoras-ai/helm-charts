{{- if and .Values.networkPolicy.enabled .Values.thorasConfigController.enabled }}
{{- if eq .Values.networkPolicy.flavor "kubernetes" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-config-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: thoras-config-controller
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow all ingress from pods within the same namespace
  - from:
    - podSelector: {}
  # Allow metrics scrapes from any namespace (networkPolicy.allowMetricsScraping)
  {{- include "thoras.metricsIngressRule" (dict "root" $ "port" .Values.thorasConfigController.prometheus.port "enabled" .Values.thorasConfigController.prometheus.enabled) | nindent 2 }}
  {{- with .Values.thorasConfigController.extraIngressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  # Allow access to the Kubernetes API server
  {{- include "thoras.apiServerEgressRule" . | nindent 2 }}
  # Allow DNS resolution
  {{- include "thoras.dnsEgressRules" . | nindent 2 }}
  {{- with .Values.thorasConfigController.extraEgressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- else if eq .Values.networkPolicy.flavor "cilium" }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-config-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: thoras-config-controller
  ingress:
  # Allow all ingress from endpoints within the same namespace
  - fromEndpoints:
    - {}
  # Allow metrics scrapes from any namespace (networkPolicy.allowMetricsScraping)
  {{- include "thoras.metricsIngressRuleCilium" (dict "root" $ "port" .Values.thorasConfigController.prometheus.port "enabled" .Values.thorasConfigController.prometheus.enabled) | nindent 2 }}
  {{- with .Values.thorasConfigController.extraIngressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  # Allow access to the Kubernetes API server
  - toEntities:
    - kube-apiserver
  # Allow DNS resolution
  {{- include "thoras.dnsEgressRulesCilium" . | nindent 2 }}
  {{- with .Values.thorasConfigController.extraEgressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
