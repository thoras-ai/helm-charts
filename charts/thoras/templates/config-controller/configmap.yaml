{{- if .Values.thorasConfigController.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: thoras-config-controller-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.thorasConfigController.labels) | nindent 4 }}
data:
  {{- /* Read once at startup. The controller excludes itself from rollouts, so
         the Deployment carries a checksum of this file to force a restart. */}}
  config-controller.yaml: |
    {{- include "thoras.configControllerConfig" . | nindent 4 }}
{{- end }}
