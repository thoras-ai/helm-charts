---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.thorasApiServerV2.labels) | nindent 4 }}
  name: {{ .Values.thorasApiServerV2.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
imagePullSecrets:
  - name: {{ include "thoras.registrySecretName" . }}
