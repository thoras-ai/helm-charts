{{- if .Values.networkPolicy.enabled }}
{{- if eq .Values.networkPolicy.flavor "kubernetes" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-forecast-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: thoras-forecast-worker
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow all ingress from pods within the same namespace
  - from:
    - podSelector: {}
  # Allow metrics scrapes from any namespace (networkPolicy.allowMetricsScraping)
  {{- include "thoras.metricsIngressRule" (dict "root" $ "port" .Values.thorasForecast.prometheus.port "enabled" .Values.thorasForecast.prometheus.enabled) | nindent 2 }}
  {{- with .Values.thorasForecast.extraIngressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  # Allow all egress to pods within the same namespace
  - to:
    - podSelector: {}
  # Allow DNS resolution
  {{- include "thoras.dnsEgressRules" . | nindent 2 }}
  {{- with .Values.thorasForecast.extraEgressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- else if eq .Values.networkPolicy.flavor "cilium" }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-forecast-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thoras.resourceLabels" (dict "root" .) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: thoras-forecast-worker
  ingress:
  # Allow all ingress from endpoints within the same namespace
  - fromEndpoints:
    - {}
  # Allow metrics scrapes from any namespace (networkPolicy.allowMetricsScraping)
  {{- include "thoras.metricsIngressRuleCilium" (dict "root" $ "port" .Values.thorasForecast.prometheus.port "enabled" .Values.thorasForecast.prometheus.enabled) | nindent 2 }}
  {{- with .Values.thorasForecast.extraIngressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  # Allow all egress to endpoints within the same namespace
  - toEndpoints:
    - {}
  # Allow DNS resolution
  {{- include "thoras.dnsEgressRulesCilium" . | nindent 2 }}
  {{- with .Values.thorasForecast.extraEgressRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
