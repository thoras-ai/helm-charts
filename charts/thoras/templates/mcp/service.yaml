{{- if (.Values.thorasMcp).enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: thoras-mcp
  namespace: {{ .Release.Namespace }}
  {{- with .Values.thorasMcp.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app: thoras-mcp
    {{- include "thoras.resourceLabels" (dict "root" . "component" .Values.thorasMcp.labels) | nindent 4 }}
spec:
  ports:
  - name: http
    port: {{ .Values.thorasMcp.port }}
    protocol: TCP
    targetPort: {{ .Values.thorasMcp.containerPort }}
  selector:
    app: thoras-mcp
{{- end }}
